let _editingAulaId = null;

function abrirModalAula(id = null) {
  _editingAulaId = id;
  document.getElementById('modal-aula-title').textContent = id ? 'Editar Aula' : 'Nova Aula';
  if (id) {
    const a = _aulasCache.find(x => x.id === id);
    if (a) {
      document.getElementById('a-num').value         = a.num || '';
      document.getElementById('a-titulo').value      = a.titulo || '';
      document.getElementById('a-descricao').value   = a.descricao || '';
      document.getElementById('a-video-url').value   = a.video_url || '';
      document.getElementById('a-qualidades').value  = qualidadesToText(a.qualidades || []);
      document.getElementById('a-thumb').value       = a.thumb_url || '';
      document.getElementById('a-disponivel').checked = !!a.disponivel;
    }
  } else {
    document.getElementById('a-num').value         = '';
    document.getElementById('a-titulo').value      = '';
    document.getElementById('a-descricao').value   = '';
    document.getElementById('a-video-url').value   = '';
    document.getElementById('a-qualidades').value  = '';
    document.getElementById('a-thumb').value       = '';
    document.getElementById('a-disponivel').checked = false;
  }
  /* Reseta o input de arquivo */
  const fInput = document.getElementById('a-video-file');
  if (fInput) {
    fInput.value = '';
    /* Garante que o listener está registrado uma única vez */
    if (!fInput.dataset.bound) {
      fInput.addEventListener('change', handleAulaFileUpload);
      fInput.dataset.bound = '1';
    }
  }
  const st = document.getElementById('a-upload-status');
  if (st) {
    st.textContent = 'Selecione um MP4/WEBM até 50 MB. A URL será preenchida automaticamente abaixo.';
    st.style.color = '';
  }
  /* Liga handlers e renderiza preview da thumb */
  _bindThumbHandlers();
  const tFile = document.getElementById('a-thumb-file');
  if (tFile) tFile.value = '';
  _renderThumbPreview('a', document.getElementById('a-thumb').value);
  document.getElementById('modal-aula').classList.add('open');
}
function fecharModalAula() {
  document.getElementById('modal-aula')?.classList.remove('open');
  _editingAulaId = null;
  const fInput = document.getElementById('a-video-file');
  if (fInput) fInput.value = '';
  const st = document.getElementById('a-upload-status');
  if (st) {
    st.textContent = 'Selecione um MP4/WEBM até 50 MB. A URL será preenchida automaticamente abaixo.';
    st.style.color = '';
  }
}

/* ══════════════════════════════════════
   UPLOAD DE THUMBNAIL (aulas e apostilas)
══════════════════════════════════════ */
/* prefix = 'a' (aula) ou 'm' (módulo/apostila) — IDs dos elementos seguem o prefixo. */
async function handleThumbUpload(ev, prefix) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const status   = document.getElementById(prefix + '-thumb-status');
  const urlInput = document.getElementById(prefix + '-thumb');
  const preview  = document.getElementById(prefix + '-thumb-preview');
  const btnClear = document.getElementById(prefix + '-thumb-clear');

  if (file.size > 15 * 1024 * 1024) {
    status.style.color = '#dc2626';
    status.textContent = `Imagem de ${(file.size/1024/1024).toFixed(1)} MB excede 15 MB.`;
    ev.target.value = '';
    return;
  }

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `thumbs/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

  status.style.color = '';
  status.textContent = 'Enviando…';

  const { error } = await sb.storage.from('aulas-videos').upload(path, file, {
    upsert: false,
    contentType: file.type || 'image/jpeg',
    cacheControl: '3600',
  });
  if (error) {
    status.style.color = '#dc2626';
    status.textContent = 'Erro: ' + error.message;
    return;
  }
  const { data: { publicUrl } } = sb.storage.from('aulas-videos').getPublicUrl(path);
  urlInput.value = publicUrl;
  _renderThumbPreview(prefix, publicUrl);
  status.style.color = 'var(--green)';
  status.textContent = '✓ Imagem enviada!';
}

function _renderThumbPreview(prefix, url) {
  const preview  = document.getElementById(prefix + '-thumb-preview');
  const btnClear = document.getElementById(prefix + '-thumb-clear');
  if (!preview) return;
  if (url && url.trim()) {
    preview.innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
    preview.classList.add('has-image');
    if (btnClear) btnClear.style.display = '';
  } else {
    const placeholder = prefix === 'a' ? '🎬' : '📘';
    preview.innerHTML = `<span class="thumb-placeholder">${placeholder}</span>`;
    preview.classList.remove('has-image');
    if (btnClear) btnClear.style.display = 'none';
  }
}

function limparThumb(prefix) {
  document.getElementById(prefix + '-thumb').value = '';
  _renderThumbPreview(prefix, null);
  const status = document.getElementById(prefix + '-thumb-status');
  if (status) { status.style.color = ''; status.textContent = 'JPG/PNG/WEBP até 15 MB. Ou cole a URL abaixo.'; }
}

/* Liga os listeners uma única vez (input file + paste de URL atualiza preview) */
function _bindThumbHandlers() {
  ['a', 'm'].forEach(prefix => {
    const fileInput = document.getElementById(prefix + '-thumb-file');
    const urlInput  = document.getElementById(prefix + '-thumb');
    if (fileInput && !fileInput.dataset.bound) {
      fileInput.addEventListener('change', (e) => handleThumbUpload(e, prefix));
      fileInput.dataset.bound = '1';
    }
    if (urlInput && !urlInput.dataset.bound) {
      urlInput.addEventListener('input', () => _renderThumbPreview(prefix, urlInput.value));
      urlInput.dataset.bound = '1';
    }
  });
}

/* Upload de vídeo do computador → Supabase Storage → preenche URL */
async function handleAulaFileUpload(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const status   = document.getElementById('a-upload-status');
  const urlInput = document.getElementById('a-video-url');
  const saveBtn  = document.getElementById('btn-aula-save');

  /* Limite imposto pelo servidor Supabase no plano Free */
  if (file.size > 50 * 1024 * 1024) {
    status.style.color = '#dc2626';
    status.textContent = `Arquivo de ${(file.size/1024/1024).toFixed(1)} MB excede 50 MB. Comprima o vídeo ou hospede no YouTube e cole a URL.`;
    ev.target.value = '';
    return;
  }

  /* Sanitiza nome (sem acentos/espaços/símbolos) */
  const safeName = file.name
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9._-]/g,'_')
    .replace(/_+/g,'_');
  const path = `uploads/${Date.now()}-${safeName}`;

  status.style.color = '';
  status.textContent = `Enviando ${(file.size/1024/1024).toFixed(1)} MB…`;
  saveBtn && (saveBtn.disabled = true);

  const { error } = await sb.storage.from('aulas-videos').upload(path, file, {
    upsert: false,
    contentType: file.type || 'video/mp4',
    cacheControl: '3600',
  });
  saveBtn && (saveBtn.disabled = false);

  if (error) {
    status.style.color = '#dc2626';
    status.textContent = 'Erro no upload: ' + error.message;
    return;
  }

  const { data: { publicUrl } } = sb.storage.from('aulas-videos').getPublicUrl(path);
  urlInput.value = publicUrl;
  status.style.color = 'var(--green)';
  status.textContent = '✓ Vídeo enviado! URL preenchida abaixo. Clique em Salvar.';
}

async function salvarAula() {
  const btn = document.getElementById('btn-aula-save');
  btn.disabled = true; btn.textContent = 'Salvando…';

  const qualidades = parseQualidades(document.getElementById('a-qualidades').value);
  const payload = {
    num:        document.getElementById('a-num').value.trim() || null,
    titulo:     document.getElementById('a-titulo').value.trim(),
    descricao:  document.getElementById('a-descricao').value.trim() || null,
    video_url:  document.getElementById('a-video-url').value.trim() || null,
    qualidades: qualidades,
    thumb_url:  document.getElementById('a-thumb').value.trim() || null,
    disponivel: document.getElementById('a-disponivel').checked,
  };

  if (!payload.titulo) {
    alert('Título é obrigatório.');
    btn.disabled = false; btn.textContent = 'Salvar'; return;
  }
  if (!payload.video_url && qualidades.length === 0) {
    alert('Informe a URL do vídeo ou pelo menos uma qualidade.');
    btn.disabled = false; btn.textContent = 'Salvar'; return;
  }

  let error;
  if (_editingAulaId) {
    ({ error } = await sb.from('aulas').update(payload).eq('id', _editingAulaId));
  } else {
    const maxOrdem = _aulasCache.length ? Math.max(..._aulasCache.map(a => a.ordem || 0)) : 0;
    ({ error } = await sb.from('aulas').insert({ ...payload, ordem: maxOrdem + 1 }));
  }
  btn.disabled = false; btn.textContent = 'Salvar';
  if (error) { alert('Erro: ' + error.message); return; }
  fecharModalAula();
  await recarregarAulas();
}

async function deletarAula(id) {
  if (!confirm('Excluir esta aula? Esta ação não pode ser desfeita.')) return;
  const { error } = await sb.from('aulas').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await recarregarAulas();
}

async function toggleDisponivelAula(id, current) {
  const { error } = await sb.from('aulas').update({ disponivel: !current }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await recarregarAulas();
}

/* ══════════════════════════════════════
   PLAYER DE VÍDEO
══════════════════════════════════════ */
const SPEED_OPTIONS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
let _currentAula    = null;
let _currentQuality = null;   // label
let _currentSpeed   = 1;
let _ytPlayer       = null;   // YT.Player ativo (se a aula atual for YouTube)
let _ytPollTimer    = null;
let _progressTimer  = null;   // throttle do timeupdate
let _lastSavedSec   = 0;

/* Carrega a YouTube IFrame API uma única vez */
function loadYouTubeAPI() {
  if (_ytApiPromise) return _ytApiPromise;
  _ytApiPromise = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve();
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = () => resolve();
  });
  return _ytApiPromise;
}

/* Retorna o segundo atual e a duração — funciona tanto pra <video> quanto pro YT */
function _playerCurrent() {
  if (_ytPlayer && typeof _ytPlayer.getCurrentTime === 'function') {
    return { current: _ytPlayer.getCurrentTime() || 0, duration: _ytPlayer.getDuration() || 0 };
  }
  const v = document.getElementById('video-frame');
  return { current: v?.currentTime || 0, duration: v?.duration || 0 };
}

function _playerSeek(sec) {
  if (_ytPlayer && typeof _ytPlayer.seekTo === 'function') {
    _ytPlayer.seekTo(sec, true);
  } else {
    const v = document.getElementById('video-frame');
    if (v) v.currentTime = sec;
  }
}

function fmtSec(total) {
  total = Math.max(0, Math.floor(total));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return (h ? `${h}:${String(m).padStart(2,'0')}` : `${m}`) + `:${String(s).padStart(2,'0')}`;
}

/* Salva progresso no banco com throttle de 5s */
async function _salvarProgressoTick() {
  if (!_currentAula) return;
  const { current, duration } = _playerCurrent();
  if (!duration || !current) return;
  if (Math.abs(current - _lastSavedSec) < 5) return;
  _lastSavedSec = current;

  const previousConcluida = !!_progressoMap[_currentAula.id]?.concluida;
  const concluida = (current / duration) >= 0.95;
  const payload = {
    user_id:   _currentUserId,
    aula_id:   _currentAula.id,
    segundos:  Math.floor(current),
    duracao:   Math.floor(duration),
    concluida,
    atualizado_em: new Date().toISOString(),
  };
  _progressoMap[_currentAula.id] = payload;
  const fill = document.getElementById('video-progress-fill');
  if (fill) fill.style.width = Math.min(100, (current / duration) * 100) + '%';
  await sb.from('progresso_aulas').upsert(payload, { onConflict: 'user_id,aula_id' });

  /* Concluiu agora E ainda não avaliou → abre modal de feedback */
  if (concluida && !previousConcluida && !jaAvaliou('aula', _currentAula.id)) {
    setTimeout(() => {
      if (_currentAula) abrirModalFeedback('aula', _currentAula.id, _currentAula.titulo, _currentAula.num);
    }, 600);
  }
}

async function abrirAula(id) {
  const a = _aulasCache.find(x => x.id === id);
  if (!a) return;
  _currentAula  = a;
  _lastSavedSec = 0;

  document.getElementById('video-num').textContent       = a.num || 'AULA';
  document.getElementById('video-title-lbl').textContent = a.titulo || '';
  document.getElementById('video-desc-box').textContent  = a.descricao || '';
  document.getElementById('video-desc-box').style.display = a.descricao ? '' : 'none';

  const video       = document.getElementById('video-frame');
  const ytEl        = document.getElementById('yt-frame');
  const speedWrap   = document.getElementById('speed-wrap');
  const qualityWrap = document.getElementById('quality-wrap');
  const hint        = document.getElementById('video-hint');

  /* Monta a lista de fontes (qualidades extras + video_url) */
  const extras = Array.isArray(a.qualidades) ? a.qualidades.filter(q => q && q.url) : [];
  let qualities = [...extras];
  if (a.video_url && !qualities.some(q => q.url === a.video_url)) {
    qualities.unshift({ label: 'auto', url: a.video_url });
  }
  if (!qualities.length && a.video_url) qualities = [{ label: 'auto', url: a.video_url }];

  const first = qualities[0];
  const ytId  = first ? youtubeId(first.url) : null;

  document.getElementById('video-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  /* Carrega notas + comentários em paralelo */
  carregarNotas(a.id);
  carregarComentarios(a.id);
  _atualizarBotaoAvaliarAula();

  /* Posiciona barra de progresso inicial */
  const prevProg = _progressoMap[a.id];
  const fill     = document.getElementById('video-progress-fill');
  if (fill && prevProg?.duracao) {
    fill.style.width = ((prevProg.segundos / prevProg.duracao) * 100) + '%';
  } else if (fill) {
    fill.style.width = '0%';
  }
  const retomarSec = (prevProg && prevProg.duracao && (prevProg.segundos / prevProg.duracao) < 0.95) ? prevProg.segundos : 0;

  /* ── Caso 1: YouTube → usa YT.Player pra rastrear progresso ── */
  if (ytId) {
    video.pause?.(); video.removeAttribute('src'); video.load?.();
    video.style.display = 'none';
    ytEl.style.display = '';
    if (speedWrap)   speedWrap.style.display   = 'none';
    if (qualityWrap) qualityWrap.style.display = 'none';
    if (hint) hint.textContent = 'Velocidade/qualidade via menu do YouTube · 📝 Anote momentos abaixo';

    await loadYouTubeAPI();
    if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; }
    /* Substitui o div por um novo (YT.Player o substitui por iframe) */
    ytEl.innerHTML = '<div id="yt-player-inner"></div>';
    _ytPlayer = new YT.Player('yt-player-inner', {
      videoId: ytId,
      width:  '100%',
      height: '100%',
      playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, start: Math.floor(retomarSec) },
      events: {
        onReady: () => {
          if (_ytPollTimer) clearInterval(_ytPollTimer);
          _ytPollTimer = setInterval(_salvarProgressoTick, 5000);
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) _salvarProgressoTick();
        }
      }
    });
    return;
  }

  /* ── Caso 2: Vídeo direto (MP4/WEBM) ── */
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; }
  if (_ytPollTimer) { clearInterval(_ytPollTimer); _ytPollTimer = null; }
  ytEl.innerHTML = ''; ytEl.style.display = 'none';
  video.style.display = '';
  if (hint) hint.textContent = 'ESPAÇO play/pause · ←/→ avançar · 📝 Anote momentos abaixo';

  /* Render menu de qualidades */
  const qualityMenu = document.getElementById('quality-menu');
  if (qualities.length > 1) {
    qualityWrap.style.display = '';
    qualityMenu.innerHTML = qualities.map((q, i) => `
      <div class="vctrl-menu-item ${i===0?'active':''}" data-quality-url="${escapeHtml(q.url)}" data-quality-label="${escapeHtml(q.label)}">
        <span>${escapeHtml(q.label)}</span><span class="check">✓</span>
      </div>
    `).join('');
    qualityMenu.querySelectorAll('.vctrl-menu-item').forEach(el => {
      el.addEventListener('click', () => setQuality(el.dataset.qualityUrl, el.dataset.qualityLabel));
    });
  } else {
    qualityWrap.style.display = 'none';
  }

  /* Render menu de velocidades */
  if (speedWrap) speedWrap.style.display = '';
  const speedMenu = document.getElementById('speed-menu');
  speedMenu.innerHTML = SPEED_OPTIONS.map(s => `
    <div class="vctrl-menu-item ${s===1?'active':''}" data-speed="${s}">
      <span>${s}x${s===1?' (normal)':''}</span><span class="check">✓</span>
    </div>
  `).join('');
  speedMenu.querySelectorAll('.vctrl-menu-item').forEach(el => {
    el.addEventListener('click', () => setPlaybackRate(parseFloat(el.dataset.speed)));
  });

  /* Carrega vídeo na primeira qualidade */
  if (first) {
    _currentQuality = first.label;
    document.getElementById('quality-label').textContent = `Qualidade: ${first.label}`;
    video.src = first.url;
  }
  _currentSpeed = 1;
  video.playbackRate = 1;
  document.getElementById('speed-label').textContent = 'Velocidade: 1x';
  video.addEventListener('loadedmetadata', function onceMeta() {
    if (retomarSec > 0) video.currentTime = retomarSec;
    video.removeEventListener('loadedmetadata', onceMeta);
  });
  video.removeEventListener('timeupdate', _salvarProgressoTick);
  video.addEventListener('timeupdate', _salvarProgressoTick);
  video.addEventListener('ended', _salvarProgressoTick);
  video.play().catch(()=>{ /* autoplay bloqueado → ok, usuário clica */ });
}

async function fecharAula() {
  const ov = document.getElementById('video-overlay');
  if (!ov || !ov.classList.contains('open')) return;

  /* Salva progresso final antes de fechar */
  _lastSavedSec = 0; // força salvar
  try { await _salvarProgressoTick(); } catch(e) {}

  ov.classList.remove('open');
  const v = document.getElementById('video-frame');
  if (v) {
    v.removeEventListener('timeupdate', _salvarProgressoTick);
    v.removeEventListener('ended', _salvarProgressoTick);
    v.pause(); v.removeAttribute('src'); v.load();
  }
  const ytEl = document.getElementById('yt-frame');
  if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; }
  if (_ytPollTimer) { clearInterval(_ytPollTimer); _ytPollTimer = null; }
  if (ytEl) { ytEl.innerHTML = ''; ytEl.style.display = 'none'; }

  document.body.style.overflow = '';
  closeAllVctrlMenus();
  _currentAula = null;

  /* Atualiza UI dos cards e do "continuar assistindo" */
  if (window._isAdmin !== undefined) {
    renderAulas(_aulasCache, !!window._isAdmin);
    renderContinueWatching();
  }
}

function setPlaybackRate(rate) {
  const v = document.getElementById('video-frame');
  if (!v) return;
  v.playbackRate = rate;
  _currentSpeed = rate;
  document.getElementById('speed-label').textContent = `Velocidade: ${rate}x`;
  document.querySelectorAll('#speed-menu .vctrl-menu-item').forEach(el => {
    el.classList.toggle('active', parseFloat(el.dataset.speed) === rate);
  });
  closeAllVctrlMenus();
}

function setQuality(url, label) {
  const v = document.getElementById('video-frame');
  if (!v) return;
  const wasPlaying = !v.paused;
  const time = v.currentTime;
  v.src = url;
  v.addEventListener('loadedmetadata', function once() {
    v.currentTime = time;
    v.playbackRate = _currentSpeed;
    if (wasPlaying) v.play().catch(()=>{});
    v.removeEventListener('loadedmetadata', once);
  });
  _currentQuality = label;
  document.getElementById('quality-label').textContent = `Qualidade: ${label}`;
  document.querySelectorAll('#quality-menu .vctrl-menu-item').forEach(el => {
    el.classList.toggle('active', el.dataset.qualityUrl === url);
  });
  closeAllVctrlMenus();
}

function toggleVctrlMenu(which) {
  const menu = document.getElementById(which === 'speed' ? 'speed-menu' : 'quality-menu');
  const other = document.getElementById(which === 'speed' ? 'quality-menu' : 'speed-menu');
  if (other) other.classList.remove('open');
  if (menu) menu.classList.toggle('open');
}
function closeAllVctrlMenus() {
  document.querySelectorAll('.vctrl-menu').forEach(m => m.classList.remove('open'));
}
/* Fecha os menus ao clicar fora */
document.addEventListener('click', (e) => {
  if (!e.target.closest('.vctrl')) closeAllVctrlMenus();
});
/* Atalhos de teclado dentro do player */
document.addEventListener('keydown', (e) => {
  const ov = document.getElementById('video-overlay');
  if (!ov || !ov.classList.contains('open')) return;
  /* Não interferir se o foco estiver em algum input */
  const tag = (document.activeElement?.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  /* No YouTube o iframe consome os atalhos próprios → não duplica */
  if (_ytPlayer) return;
  const v = document.getElementById('video-frame');
  if (!v) return;
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === 'ArrowRight') { v.currentTime = Math.min(v.duration||1e9, v.currentTime + 5); }
  else if (e.key === 'ArrowLeft')  { v.currentTime = Math.max(0, v.currentTime - 5); }
});

   HOME — "Continuar assistindo"
══════════════════════════════════════ */
function renderContinueWatching() {
  const wrap = document.getElementById('continue-watching-wrap');
  if (!wrap) return;
  /* Acha a aula com progresso > 0 e < 95% mais recente */
  const candidatos = Object.values(_progressoMap)
    .filter(p => p.duracao && (p.segundos / p.duracao) < 0.95 && p.segundos > 5)
    .sort((a,b) => new Date(b.atualizado_em||0) - new Date(a.atualizado_em||0));
  const cont = candidatos[0];
  if (!cont) { wrap.innerHTML = ''; return; }
  const aula = _aulasCache.find(a => a.id === cont.aula_id);
  if (!aula) { wrap.innerHTML = ''; return; }
  const pct = Math.min(100, Math.round((cont.segundos / cont.duracao) * 100));
  const thumb = aula.thumb_url
    ? `<img src="${escapeHtml(aula.thumb_url)}" alt="">`
    : '🎬';
  wrap.innerHTML = `
    <div class="continue-card" onclick="navigate('aulas'); setTimeout(()=>abrirAula(${aula.id}), 200)">
      <div class="continue-thumb">${thumb}</div>
      <div class="continue-info">
        <div class="continue-label">▶ Continuar assistindo</div>
        <div class="continue-title">${escapeHtml(aula.titulo||'')}</div>
        <div class="continue-progress"><div class="continue-progress-fill" style="width:${pct}%"></div></div>
        <div class="continue-pct">${pct}% · faltam ${fmtSec(cont.duracao - cont.segundos)}</div>
      </div>
    </div>`;
}

let _notasCache = [];

async function carregarNotas(aulaId) {

function renderNotas() {

  if (!list) return;

function abrirModalNota(editId = null) {
  const { current } = _playerCurrent();
  const sec = editId ? (_notasCache.find(n => n.id === editId)?.segundo ?? current) : current;
  document.getElementById('nota-tempo-lbl').textContent = `@ ${fmtSec(sec)}`;
  document.getElementById('nota-editing-id').value = editId || '';
  if (editId) {
    const n = _notasCache.find(x => x.id === editId);

async function salvarNota() {
  const texto = document.getElementById('nota-texto').value.trim();
  if (!texto) { alert('Escreva alguma coisa.'); return; }
  const editId = document.getElementById('nota-editing-id').value;
  const btn = document.getElementById('btn-nota-save');
  btn.disabled = true; btn.textContent = 'Salvando…';

  let error;
  if (editId) {
    ({ error } = await sb.from('notas_aulas').update({ texto }).eq('id', editId));
  } else {
    const { current } = _playerCurrent();
    ({ error } = await sb.from('notas_aulas').insert({
      user_id: _currentUserId,
      aula_id: _currentAula.id,
      segundo: Math.floor(current),

let _comentsCache = [];
let _replyingTo   = null;

function switchVspTab(tab, btn) {
  document.querySelectorAll('.vsp-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.vsp-pane').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('vsp-pane-' + tab)?.classList.add('active');
}

async function carregarComentarios(aulaId) {
  const list = document.getElementById('coments-list');
  if (list) list.innerHTML = '<p class="vsp-empty">Carregando…</p>';
  const { data } = await sb.from('comentarios_aulas_view')
    .select('*').eq('aula_id', aulaId).order('criado_em');
  _comentsCache = data || [];
  document.getElementById('vsp-coments-count').textContent = _comentsCache.length;
  renderComentarios();
}

function _comentTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600)   return Math.floor(diff/60) + ' min atrás';
  if (diff < 86400)  return Math.floor(diff/3600) + ' h atrás';
  if (diff < 604800) return Math.floor(diff/86400) + ' dias atrás';
  return d.toLocaleDateString('pt-BR');
}

function _comentItemHTML(c, podeDeletar) {
  const av = c.autor_avatar
    ? `<img src="${escapeHtml(c.autor_avatar)}" alt="">`
    : initials(formatNome(c.autor_nome || '?'));
  const isAdm = c.autor_role === 'admin';
  return `
    <div class="coment-item" id="coment-${c.id}">
      <div class="coment-av">${av}</div>
      <div class="coment-body">
        <div class="coment-head">
          <span class="coment-author">${escapeHtml(formatNome(c.autor_nome || ''))}</span>
          ${isAdm ? '<span class="coment-admin-tag">Instrutor</span>' : ''}
          <span class="coment-time">${_comentTime(c.criado_em)}</span>
        </div>
        <div class="coment-text">${escapeHtml(c.texto)}</div>
        <div class="coment-actions">
          ${c.parent_id ? '' : `<button onclick="responderComentario(${c.id}, '${escapeHtml((c.autor_nome||'').split(' ')[0])}')">Responder</button>`}
          ${podeDeletar ? `<button class="danger" onclick="deletarComentario(${c.id})">Excluir</button>` : ''}
        </div>
      </div>
    </div>`;
}

function renderComentarios() {
  const list = document.getElementById('coments-list');
  if (!list) return;
  if (!_comentsCache.length) {
    list.innerHTML = '<p class="vsp-empty">Seja o primeiro a comentar nesta aula.</p>';
    return;
  }
  const isAdm = !!window._isAdmin;
  const roots = _comentsCache.filter(c => !c.parent_id);
  const byParent = {};
  _comentsCache.filter(c => c.parent_id).forEach(c => {
    (byParent[c.parent_id] ||= []).push(c);
  });
  list.innerHTML = roots.map(r => {
    const replies = byParent[r.id] || [];
    return _comentItemHTML(r, isAdm || r.user_id === _currentUserId) +
      (replies.length
        ? `<div class="coment-replies">${replies.map(rp => _comentItemHTML(rp, isAdm || rp.user_id === _currentUserId)).join('')}</div>`
        : '');
  }).join('');
}

function responderComentario(parentId, nomeAutor) {
  _replyingTo = parentId;
  document.getElementById('coment-parent-id').value = parentId;
  document.getElementById('coment-reply-hint').textContent = `↳ Respondendo a ${nomeAutor}`;
  document.getElementById('coment-cancel-btn').style.display = '';
  document.getElementById('coment-text').focus();
}
function cancelarReply() {
  _replyingTo = null;
  document.getElementById('coment-parent-id').value = '';
  document.getElementById('coment-reply-hint').textContent = '';
  document.getElementById('coment-cancel-btn').style.display = 'none';
}

async function enviarComentario(ev) {
  ev.preventDefault();
  const texto    = document.getElementById('coment-text').value.trim();
  const parentId = document.getElementById('coment-parent-id').value || null;
  if (!texto) return;
  const { error } = await sb.from('comentarios_aulas').insert({
    user_id:   _currentUserId,
    aula_id:   _currentAula.id,
    parent_id: parentId ? parseInt(parentId, 10) : null,
    texto,
  });
  if (error) { alert('Erro: ' + error.message); return; }
  document.getElementById('coment-text').value = '';
  cancelarReply();
  await carregarComentarios(_currentAula.id);
}

async function deletarComentario(id) {
  if (!confirm('Excluir este comentário?')) return;
  const { error } = await sb.from('comentarios_aulas').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await carregarComentarios(_currentAula.id);
}

══════════════════════════════════════ */
const _ratingLabels = ['Toque nas estrelas para avaliar','Muito ruim 😞','Ruim 😕','Ok 😐','Bom 😊','Excelente! 🤩'];
let _meusFeedbacks  = {};  // chave "aula:5" / "apostila:3" → feedback

async function carregarMeusFeedbacks() {
  const { data } = await sb.from('feedbacks').select('id,tipo,aula_id,apostila_id,nota,categoria,comentario').eq('user_id', _currentUserId);
  _meusFeedbacks = {};
  (data || []).forEach(f => {
    const key = f.tipo + ':' + (f.aula_id || f.apostila_id);
    _meusFeedbacks[key] = f;
  });
}

function jaAvaliou(tipo, id) {
  return !!_meusFeedbacks[tipo + ':' + id];
}

function abrirModalFeedback(tipo, conteudoId, titulo, num) {
  document.getElementById('fb-tipo').value          = tipo;
  document.getElementById('fb-conteudo-id').value   = conteudoId;
  document.getElementById('fb-content-tipo').textContent = tipo === 'aula' ? '🎬 AULA' : '📘 APOSTILA';
  document.getElementById('fb-content-titulo').textContent = (num ? num + ' · ' : '') + (titulo || '');

  const existing = _meusFeedbacks[tipo + ':' + conteudoId];
  const ta       = document.getElementById('fb-comentario');

  if (existing) {
    /* Modo VIEW — usuário já avaliou */
    document.body.classList.add('fb-modo-view');
    document.querySelector('#modal-feedback .modal-title').textContent = 'Sua avaliação';
    ta.value = existing.comentario || '';
    ta.placeholder = '(você não deixou nenhum comentário)';
    ta.readOnly = true;
    setFbRating(existing.nota || 0);
    document.getElementById('btn-fb-save').textContent = 'Salvar alterações';
    document.getElementById('btn-fb-cancel').textContent = 'Fechar';
  } else {
    /* Modo EDIT — primeira avaliação */
    document.body.classList.remove('fb-modo-view');
    document.querySelector('#modal-feedback .modal-title').textContent = '⭐ Avaliar conteúdo';
    ta.value = '';
    ta.placeholder = 'Conte o motivo da sua avaliação — uma sugestão, elogio ou ponto a melhorar...';
    ta.readOnly = false;
    setFbRating(0);
    document.getElementById('btn-fb-save').textContent = 'Enviar avaliação';
    document.getElementById('btn-fb-cancel').textContent = 'Avaliar depois';
  }
  document.getElementById('modal-feedback').classList.add('open');
}

/* Libera os campos do modal pra edição (a partir do modo view) */
function editarFeedbackAtual() {
  document.body.classList.remove('fb-modo-view');
  const ta = document.getElementById('fb-comentario');
  ta.readOnly = false;
  ta.placeholder = 'Conte o motivo da sua avaliação...';
  document.querySelector('#modal-feedback .modal-title').textContent = '✏️ Editar avaliação';
  document.getElementById('btn-fb-cancel').textContent = 'Cancelar';
  ta.focus();
}

/* Wrapper chamado pelo botão do PDF viewer */
function avaliarApostilaAtual() {
  if (!_currentApostila) return;
  abrirModalFeedback('apostila', _currentApostila.id, _currentApostila.titulo, _currentApostila.num);
}

/* Wrapper chamado pelo botão do player de aula (ao lado das abas) */
function avaliarAulaAtual() {
  if (!_currentAula) return;
  abrirModalFeedback('aula', _currentAula.id, _currentAula.titulo, _currentAula.num);
}

/* Atualiza o conteúdo do botão verde "Avaliar" no header do PDF */
function _atualizarBotaoAvaliarPDF() {
  const wrap = document.getElementById('pdf-avaliar-content');
  const btn  = document.getElementById('btn-pdf-avaliar');
  if (!wrap || !btn) return;
  if (!_currentApostila) { btn.style.display = 'none'; return; }

/* Atualiza o conteúdo do botão verde "Avaliar" no header das abas da aula */
function _atualizarBotaoAvaliarAula() {
  const wrap = document.getElementById('aula-avaliar-content');
  const btn  = document.getElementById('btn-aula-avaliar');
  if (!wrap || !btn) return;
  if (!_currentAula) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  const fb = _meusFeedbacks['aula:' + _currentAula.id];
  if (fb) {
    wrap.innerHTML = `<span class="mini-stars">${'★'.repeat(fb.nota)}${'☆'.repeat(5-fb.nota)}</span>`;
    btn.title = `Sua nota: ${fb.nota} / 5 — clique para ver/editar`;
  } else {
    wrap.textContent = '⭐ Avaliar';
    btn.title = 'Avaliar esta aula';

function fecharModalFeedback() {
  document.getElementById('modal-feedback')?.classList.remove('open');
}

function setFbRating(v) {
  document.getElementById('fb-rating').value = v;
  document.querySelectorAll('.fb-star').forEach((s, i) => {
    s.classList.toggle('active', i < v);
  });
  document.getElementById('fb-rating-label').textContent = _ratingLabels[v] || _ratingLabels[0];
}

async function enviarFeedback() {
  const nota       = parseInt(document.getElementById('fb-rating').value, 10);
  const tipo       = document.getElementById('fb-tipo').value;
  const conteudoId = parseInt(document.getElementById('fb-conteudo-id').value, 10);
  const comentario = document.getElementById('fb-comentario').value.trim();

  if (!nota || nota < 1) {
    alert('Por favor, selecione de 1 a 5 estrelas.');
    return;
  }
  const btn = document.getElementById('btn-fb-save');
  btn.disabled = true; btn.textContent = 'Enviando…';

  const payload = {
    user_id:    _currentUserId,
    tipo,
    aula_id:     tipo === 'aula'     ? conteudoId : null,
    apostila_id: tipo === 'apostila' ? conteudoId : null,
    nota,
    comentario:  comentario || null,
  };

  /* Upsert manual: tenta insert, se já existir → update */
  const existing = _meusFeedbacks[tipo + ':' + conteudoId];
  let error;
  if (existing) {
    ({ error } = await sb.from('feedbacks').update({ nota, comentario: comentario || null }).eq('id', existing.id));
  } else {
    ({ error } = await sb.from('feedbacks').insert(payload));
  }

  btn.disabled = false; btn.textContent = 'Enviar avaliação';
  if (error) { alert('Erro: ' + error.message); return; }

  await carregarMeusFeedbacks();
  fecharModalFeedback();

  /* Re-renderiza grids pra atualizar os botões "Avaliar agora" → "Editar avaliação" */
  if (_aulasCache.length)     renderAulas(_aulasCache, !!window._isAdmin);
  if (_apostilasCache.length) renderApostilas(_apostilasCache, !!window._isAdmin);
  _atualizarBotaoAvaliarPDF();
  _atualizarBotaoAvaliarAula();

  /* Toast simples */
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#15803d;color:#fff;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:eip-toast .35s ease';
  toast.textContent = '✓ Obrigado pelo feedback!';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

let _topicosCache = { forum: [], duvidas: [] };
let _currentTopico = null;
let _respostasCache = [];

function _formatDataTopico(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)     return 'agora';
  if (diff < 3600)   return Math.floor(diff/60) + ' min atrás';
  if (diff < 86400)  return Math.floor(diff/3600) + ' h atrás';
  if (diff < 604800) return Math.floor(diff/86400) + ' dias atrás';
  return d.toLocaleDateString('pt-BR');
}

async function carregarTopicos(area) {
  const listEl = document.getElementById(area + '-list');
  if (!listEl) return;
  listEl.innerHTML = '<p style="color:var(--muted);padding:14px">Carregando…</p>';
  const { data, error } = await sb.from('forum_topicos_view')
    .select('*').eq('area', area)
    .order('fixado', { ascending: false })
    .order('ultima_atividade', { ascending: false });
  if (error) {
    listEl.innerHTML = `<p style="color:#dc2626;padding:14px">Erro: ${escapeHtml(error.message)}</p>`;
    return;
  }
  _topicosCache[area] = data || [];
  renderTopicos(area);
}

function renderTopicos(area) {
  const listEl = document.getElementById(area + '-list');
  if (!listEl) return;
  const data = _topicosCache[area] || [];
  if (!data.length) {
    const labelEmpty = area === 'forum'
      ? { ico:'💬', titulo:'Nenhum tópico aberto ainda', cta:'Seja o primeiro a abrir um debate.' }
      : { ico:'❓', titulo:'Nenhuma dúvida por aqui',   cta:'Comece fazendo a primeira pergunta da turma.' };
    listEl.innerHTML = `
      <div class="topicos-empty">
        <div class="topicos-empty-icon">${labelEmpty.ico}</div>
        <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--text);margin-bottom:4px">${labelEmpty.titulo}</div>
        <p>${labelEmpty.cta}</p>
      </div>`;
    return;
  }
  listEl.innerHTML = data.map(t => {
    const nome = formatNome(t.autor_nome || '');
    const av = t.autor_avatar
      ? `<img src="${escapeHtml(t.autor_avatar)}" alt="">`
      : initials(nome || '?');
    const isAdm = t.autor_role === 'admin';
    const classes = ['topico-card'];
    if (t.fixado)  classes.push('fixado');
    if (t.fechado) classes.push('fechado');
    if (t.resolvido_resposta_id) classes.push('resolvido');
    const tags = [];
    if (t.fixado)               tags.push('<span class="topico-tag fixado">📌 Fixado</span>');
    if (t.resolvido_resposta_id)tags.push('<span class="topico-tag resolvido">✓ Resolvido</span>');
    if (t.fechado)              tags.push('<span class="topico-tag fechado">🔒 Fechado</span>');
    if (isAdm)                  tags.push('<span class="coment-admin-tag">Instrutor</span>');
    return `
      <div class="${classes.join(' ')}" onclick="abrirTopico(${t.id},'${area}')">
        <div class="topico-av">${av}</div>
        <div class="topico-body">
          <div class="topico-head-row">${tags.join('')}</div>
          <div class="topico-titulo">${escapeHtml(t.titulo || '')}</div>
          ${t.texto ? `<div class="topico-preview">${escapeHtml(t.texto)}</div>` : ''}
          <div class="topico-meta">
            <span>por <strong>${escapeHtml(nome)}</strong></span>
            <span>· ${_formatDataTopico(t.criado_em)}</span>
            ${t.ultima_atividade && t.ultima_atividade !== t.criado_em ? `<span>· última atividade ${_formatDataTopico(t.ultima_atividade)}</span>` : ''}

/* ── Novo tópico ─────────────────────────────────── */
function abrirNovoTopico(area) {
  document.getElementById('topico-novo-area').value = area;
  document.getElementById('topico-novo-titulo').value = '';
  document.getElementById('topico-novo-texto').value = '';
  document.getElementById('topico-novo-title').textContent =
    area === 'forum' ? 'Novo tópico no Fórum' : 'Nova pergunta';
  document.getElementById('btn-topico-novo-save').textContent =
    area === 'forum' ? 'Publicar' : 'Perguntar';
  document.getElementById('modal-topico-novo').classList.add('open');
  setTimeout(() => document.getElementById('topico-novo-titulo').focus(), 50);
}
function fecharNovoTopico() {
  document.getElementById('modal-topico-novo')?.classList.remove('open');
}
async function salvarNovoTopico() {
  const area    = document.getElementById('topico-novo-area').value;
  const titulo  = document.getElementById('topico-novo-titulo').value.trim();
  const texto   = document.getElementById('topico-novo-texto').value.trim();
  if (!titulo) { alert('Informe um título.'); return; }
  const btn = document.getElementById('btn-topico-novo-save');
  btn.disabled = true; btn.textContent = 'Publicando…';

  });

  btn.textContent = area === 'forum' ? 'Publicar' : 'Perguntar';
  if (error) { alert('Erro: ' + error.message); return; }
  fecharNovoTopico();
  await carregarTopicos(area);
}

/* ── Visualizar tópico ───────────────────────────── */
async function abrirTopico(topicoId, area) {
  /* Encontra o tópico no cache (tem todos os dados de autor já) */
  const t = (_topicosCache[area] || []).find(x => x.id === topicoId);
  if (!t) return;
  _currentTopico = { ...t, area };

  /* Header */
  document.getElementById('topico-view-tipo').textContent = area === 'forum' ? '💬 TÓPICO DO FÓRUM' : '❓ PERGUNTA';
  document.getElementById('topico-view-titulo').textContent = t.titulo || '';
  const av = t.autor_avatar
    ? `<img src="${escapeHtml(t.autor_avatar)}" alt="">`
    : initials(formatNome(t.autor_nome || '?'));
  document.getElementById('topico-view-avatar').innerHTML = av;
  document.getElementById('topico-view-autor').textContent = formatNome(t.autor_nome || '');
  document.getElementById('topico-view-data').textContent  = _formatDataTopico(t.criado_em);
  document.getElementById('topico-view-texto').textContent = t.texto || '(sem mensagem adicional)';

  /* Ações: admin/autor podem deletar, autor/admin podem fixar/fechar */
  const isOwner = t.user_id === _currentUserId;
  const isAdmin = !!window._isAdmin;
  const actions = [];
  if (isOwner || isAdmin) {
    actions.push(`<button class="danger" onclick="deletarTopico(${t.id},'${area}')">🗑️ Excluir</button>`);
  }
  if (isAdmin) {
    actions.push(`<button onclick="toggleFixadoTopico(${t.id},${t.fixado},'${area}')">${t.fixado ? '📌 Desafixar' : '📌 Fixar'}</button>`);
    actions.push(`<button onclick="toggleFechadoTopico(${t.id},${t.fechado},'${area}')">${t.fechado ? '🔓 Reabrir' : '🔒 Fechar'}</button>`);
  }
  document.getElementById('topico-view-actions').innerHTML = actions.join('');

  /* Form de resposta — esconde se fechado */
  document.getElementById('topico-resp-form').style.display = t.fechado ? 'none' : '';
  document.getElementById('topico-resp-texto').value = '';

  /* Carrega respostas */
  await carregarRespostas(topicoId);

  document.getElementById('modal-topico-view').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fecharTopico() {
  document.getElementById('modal-topico-view')?.classList.remove('open');
  document.body.style.overflow = '';
  _currentTopico = null;
}

async function carregarRespostas(topicoId) {
  const wrap = document.getElementById('topico-view-respostas');
  if (!wrap) return;
  wrap.innerHTML = '<p style="color:var(--muted);padding:14px;text-align:center">Carregando…</p>';
  const { data, error } = await sb.from('forum_respostas_view')
    .select('*').eq('topico_id', topicoId).order('criado_em');
  if (error) {
    wrap.innerHTML = `<p style="color:#dc2626;padding:14px">Erro: ${escapeHtml(error.message)}</p>`;
    return;
  }
  _respostasCache = data || [];
  document.getElementById('topico-view-resp-count').textContent = '(' + _respostasCache.length + ')';
  renderRespostas();
}

function renderRespostas() {
  const wrap = document.getElementById('topico-view-respostas');
  if (!wrap || !_currentTopico) return;
  if (!_respostasCache.length) {
    wrap.innerHTML = '<p style="color:var(--muted);padding:18px 0;text-align:center;font-size:13px">Nenhuma resposta ainda. Seja o primeiro a responder!</p>';
    return;
  }
  const isAdmin     = !!window._isAdmin;
  const isOwnerTopico = _currentTopico.user_id === _currentUserId;
  const showSolucaoBtn = _currentTopico.area === 'duvidas' && (isOwnerTopico || isAdmin) && !_currentTopico.fechado;
  wrap.innerHTML = _respostasCache.map(r => {
    const nome = formatNome(r.autor_nome || '');
    const av = r.autor_avatar
      ? `<img src="${escapeHtml(r.autor_avatar)}" alt="">`
      : initials(nome || '?');
    const isAdmAutor = r.autor_role === 'admin';
    const podeDeletar = (r.user_id === _currentUserId) || isAdmin;
    const ehSolucao = r.id === _currentTopico.resolvido_resposta_id;
    return `
      <div class="resposta-item ${ehSolucao?'solucao':''}">
        <div class="coment-av">${av}</div>
        <div class="coment-body">
          ${ehSolucao ? '<div class="resposta-solucao-tag">✓ Solução</div>' : ''}
          <div class="coment-head">
            <span class="coment-author">${escapeHtml(nome)}</span>
            ${isAdmAutor ? '<span class="coment-admin-tag">Instrutor</span>' : ''}
            <span class="coment-time">${_formatDataTopico(r.criado_em)}</span>
          </div>
          <div class="coment-text">${escapeHtml(r.texto || '')}</div>
          <div class="resposta-acoes">
            ${showSolucaoBtn ? (
              ehSolucao
                ? `<button class="solucao" onclick="marcarSolucao(null)">↶ Remover marcação de solução</button>`
                : `<button class="solucao" onclick="marcarSolucao(${r.id})">✓ Marcar como solução</button>`
            ) : ''}
            ${podeDeletar ? `<button class="danger" onclick="deletarResposta(${r.id})">Excluir</button>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

async function enviarRespostaTopico(ev) {
  ev.preventDefault();
  if (!_currentTopico) return;
  if (_currentTopico.fechado) { alert('Este tópico está fechado.'); return; }
  const texto = document.getElementById('topico-resp-texto').value.trim();
  if (!texto) return;
  const { error } = await sb.from('forum_respostas').insert({
    topico_id: _currentTopico.id,
    user_id:   _currentUserId,
    texto,
  });
  if (error) { alert('Erro: ' + error.message); return; }
  document.getElementById('topico-resp-texto').value = '';
  await carregarRespostas(_currentTopico.id);
  /* Atualiza count da lista de fundo */
  await carregarTopicos(_currentTopico.area);
}

async function deletarResposta(respId) {
  if (!confirm('Excluir esta resposta?')) return;
  const { error } = await sb.from('forum_respostas').delete().eq('id', respId);
  if (error) { alert('Erro: ' + error.message); return; }
  /* Se era a solução marcada, FK ON DELETE SET NULL já cuida */
  await carregarRespostas(_currentTopico.id);
  await carregarTopicos(_currentTopico.area);
}

async function deletarTopico(topicoId, area) {
  if (!confirm('Excluir este tópico e todas as respostas?')) return;
  const { error } = await sb.from('forum_topicos').delete().eq('id', topicoId);
  if (error) { alert('Erro: ' + error.message); return; }
  fecharTopico();
  await carregarTopicos(area);
}

async function toggleFixadoTopico(topicoId, atual, area) {
  const { error } = await sb.from('forum_topicos').update({ fixado: !atual }).eq('id', topicoId);
  if (error) { alert('Erro: ' + error.message); return; }
  await carregarTopicos(area);
  /* re-abre modal pro estado refletir */
  abrirTopico(topicoId, area);
}

async function toggleFechadoTopico(topicoId, atual, area) {
  const { error } = await sb.from('forum_topicos').update({ fechado: !atual }).eq('id', topicoId);
  if (error) { alert('Erro: ' + error.message); return; }
  await carregarTopicos(area);
  abrirTopico(topicoId, area);
}

async function marcarSolucao(respId) {
  if (!_currentTopico) return;
  const { error } = await sb.from('forum_topicos')
    .update({ resolvido_resposta_id: respId })
    .eq('id', _currentTopico.id);
  if (error) { alert('Erro: ' + error.message); return; }
  _currentTopico.resolvido_resposta_id = respId;
  renderRespostas();
  await carregarTopicos(_currentTopico.area);
}

function _fmtDataExtenso(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
}

function renderCertificados() {
  const grid   = document.getElementById('cert-grid');
  const banner = document.getElementById('cert-progress-banner');
  if (!grid) return;

  const apostilasConcluidas = _apostilasCache.filter(a => _progressoApostMap[a.id]?.concluida);
  const aulasConcluidas     = _aulasCache.filter(a => _progressoMap[a.id]?.concluida && a.disponivel);
  const totalConteudo  = _apostilasCache.filter(a => a.disponivel).length + _aulasCache.filter(a => a.disponivel).length;
  const totalConcluido = apostilasConcluidas.length + aulasConcluidas.length;
  const programaCompleto = totalConteudo > 0 && totalConcluido === totalConteudo;
  const pct = totalConteudo ? Math.round((totalConcluido / totalConteudo) * 100) : 0;

  if (banner) {
    banner.innerHTML = totalConteudo === 0 ? '' : `
      <div class="cert-progress-banner">
        <div style="font-size:32px">🎓</div>
        <div class="cert-progress-info">
          <div class="cert-progress-label">Seu progresso no programa</div>
          <div class="cert-progress-text">${totalConcluido} de ${totalConteudo} conteúdos concluídos${programaCompleto ? ' 🎉' : ''}</div>
          <div class="cert-progress-bar-wrap"><div class="cert-progress-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:32px;color:var(--text);font-weight:600">${pct}%</div>
      </div>`;
  }

  if (totalConcluido === 0) {
    grid.innerHTML = `
      <div class="cert-empty" style="grid-column:1/-1">
        <div class="cert-empty-icon">🎓</div>
        <div class="cert-empty-title">Você ainda não tem certificados</div>
        <p>Conclua módulos e aulas para desbloquear seus certificados de conclusão.</p>
      </div>`;
    return;
  }

  const cards = [];

  if (programaCompleto) {
    cards.push(`
      <div class="cert-card programa">
        <div class="cert-seal">🏆</div>
        <div class="cert-tipo">CERTIFICADO MASTER</div>
        <div class="cert-titulo">Programa Completo de Comércio Exterior</div>
        <div class="cert-data">Conquistado em ${_fmtDataExtenso()}</div>
        <div class="cert-actions">
          <button onclick="visualizarCertificado('programa',0)">👁️ Visualizar</button>
          <button class="primary" onclick="baixarCertificado('programa',0)">⬇ Baixar PDF</button>
        </div>
      </div>`);
  }

  apostilasConcluidas.forEach(ap => {
    const data = _fmtDataExtenso(_progressoApostMap[ap.id]?.atualizado_em);
    cards.push(`
      <div class="cert-card">
        <div class="cert-seal">📘</div>
        <div class="cert-tipo">CONCLUSÃO DE MÓDULO</div>
        <div class="cert-titulo">${escapeHtml(ap.titulo || '')}</div>
        <div class="cert-data">${ap.num ? escapeHtml(ap.num) + ' · ' : ''}Concluído em ${data}</div>
        <div class="cert-actions">
          <button onclick="visualizarCertificado('apostila',${ap.id})">👁️ Visualizar</button>
          <button class="primary" onclick="baixarCertificado('apostila',${ap.id})">⬇ Baixar PDF</button>
        </div>
      </div>`);
  });

  aulasConcluidas.forEach(au => {
    const data = _fmtDataExtenso(_progressoMap[au.id]?.atualizado_em);
    cards.push(`
      <div class="cert-card">
        <div class="cert-seal">🎬</div>
        <div class="cert-tipo">CONCLUSÃO DE AULA</div>
        <div class="cert-titulo">${escapeHtml(au.titulo || '')}</div>
        <div class="cert-data">${au.num ? escapeHtml(au.num) + ' · ' : ''}Concluído em ${data}</div>
        <div class="cert-actions">
          <button onclick="visualizarCertificado('aula',${au.id})">👁️ Visualizar</button>
          <button class="primary" onclick="baixarCertificado('aula',${au.id})">⬇ Baixar PDF</button>
        </div>
      </div>`);
  });

  grid.innerHTML = cards.join('');
}

/* Gera o PDF do certificado e retorna o doc do jsPDF (não salva) */
function _gerarCertificadoPDF({ nome, titulo, subtitulo, data, codigo, master }) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('Biblioteca de PDF ainda carregando. Tente novamente em alguns segundos.');
    return null;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  /* A4 landscape: 842 x 595 pt */
  const W = 842, H = 595;

  /* Fundo levemente creme */
  doc.setFillColor(252, 251, 247);
  doc.rect(0, 0, W, H, 'F');

  /* Bordas duplas (azul-marinho ou dourado para master) */
  const borderColor = master ? [245, 158, 11] : [10, 31, 58];
  doc.setDrawColor(...borderColor);
  doc.setLineWidth(8);
  doc.rect(30, 30, W - 60, H - 60);
  doc.setLineWidth(1.5);
  doc.rect(48, 48, W - 96, H - 96);

  /* Selo decorativo nos cantos */
  doc.setFillColor(...borderColor);
  [[60, 60], [W - 60, 60], [60, H - 60], [W - 60, H - 60]].forEach(([x, y]) => {
    doc.circle(x, y, 6, 'F');
  });

  /* Cabeçalho — brand */
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.setTextColor(200, 16, 46);
  doc.text('EXECUTIVE IMPORT PROGRAM', W / 2, 95, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(91, 107, 125);
  doc.text('HKTC DO BRASIL · CASSETARI EDUCAÇÃO INTERNACIONAL', W / 2, 113, { align: 'center' });

  /* Faixa decorativa */
  doc.setDrawColor(...borderColor);
  doc.setLineWidth(0.7);
  doc.line(W / 2 - 100, 122, W / 2 + 100, 122);

  /* Tipo do certificado */
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(...borderColor);
  doc.text(master ? 'CERTIFICADO MASTER DE CONCLUSÃO' : 'CERTIFICADO DE CONCLUSÃO',
           W / 2, 155, { align: 'center' });

  /* Texto introdutório */
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(13);
  doc.setTextColor(28, 39, 51);
  doc.text('Certificamos que', W / 2, 200, { align: 'center' });

  /* Nome do aluno — destaque */
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(36);
  doc.setTextColor(10, 31, 58);
  doc.text((nome || '').toUpperCase(), W / 2, 250, { align: 'center' });

  /* Linha sob o nome */
  doc.setLineWidth(1.5);
  doc.setDrawColor(200, 16, 46);
  doc.line(W / 2 - 180, 268, W / 2 + 180, 268);

  /* Texto descritivo */
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(13);
  doc.setTextColor(28, 39, 51);
  doc.text('concluiu com aproveitamento', W / 2, 305, { align: 'center' });

  /* Título do conteúdo */
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.setTextColor(10, 31, 58);
  const tituloLines = doc.splitTextToSize(titulo || '', W - 200);
  doc.text(tituloLines, W / 2, 345, { align: 'center' });

  /* Subtítulo */
  if (subtitulo) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(91, 107, 125);
    doc.text(subtitulo, W / 2, 372 + (tituloLines.length - 1) * 22, { align: 'center' });
  }

  /* Data */
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(11);
  doc.setTextColor(28, 39, 51);
  doc.text(`São Paulo, ${data}`, W / 2, 440, { align: 'center' });

  /* Assinatura */
  doc.setLineWidth(0.8);
  doc.setDrawColor(10, 31, 58);
  doc.line(W / 2 - 110, 490, W / 2 + 110, 490);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(10, 31, 58);
  doc.text('Daniel Cassetari', W / 2, 508, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(91, 107, 125);
  doc.text('Diretor — Executive Import Program', W / 2, 522, { align: 'center' });

  /* Código de verificação */
  doc.setFontSize(8);
  doc.setTextColor(91, 107, 125);
  doc.text(`Código de verificação: ${codigo}`, W / 2, 555, { align: 'center' });

  return doc;
}

function _prepararCert(tipo, contentId) {
  const nome = window._currentUserNome || 'Aluno';
  let titulo = '', subtitulo = '', data = '', codigo = '', master = false;

  if (tipo === 'apostila') {
    const ap = _apostilasCache.find(x => x.id === contentId);
    const prog = _progressoApostMap[contentId];
    if (!ap || !prog?.concluida) { alert('Conclua o módulo primeiro.'); return null; }
    titulo    = ap.titulo;
    subtitulo = ap.num ? `Módulo ${ap.num}` : 'Conclusão de módulo';
    data      = _fmtDataExtenso(prog.atualizado_em);
  } else if (tipo === 'aula') {
    const au = _aulasCache.find(x => x.id === contentId);
    const prog = _progressoMap[contentId];
    if (!au || !prog?.concluida) { alert('Conclua a aula primeiro.'); return null; }
    titulo    = au.titulo;
    subtitulo = au.num ? `Aula ${au.num}` : 'Conclusão de aula';
    data      = _fmtDataExtenso(prog.atualizado_em);
  } else if (tipo === 'programa') {
    titulo    = 'Programa Completo de Comércio Exterior';
    subtitulo = 'Executive Import Program — Todas as aulas e módulos concluídos';
    data      = _fmtDataExtenso();
    master    = true;
  } else {
    return null;
  }

  codigo = `EIP-${(window._currentUserId || '').slice(0,8).toUpperCase()}-${tipo[0].toUpperCase()}${contentId || 'PRG'}`;
  return { nome, titulo, subtitulo, data, codigo, master };
}

function baixarCertificado(tipo, contentId) {
  const info = _prepararCert(tipo, contentId);
  if (!info) return;
  const doc = _gerarCertificadoPDF(info);
  if (!doc) return;
  const safe = info.titulo.replace(/[^A-Za-z0-9À-ÿ]+/g, '-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  doc.save(`Certificado-${safe}.pdf`);
}

function visualizarCertificado(tipo, contentId) {
  const info = _prepararCert(tipo, contentId);
  if (!info) return;
  const doc = _gerarCertificadoPDF(info);
  if (!doc) return;
  const blobUrl = doc.output('bloburl');
  window.open(blobUrl, '_blank', 'noopener');
}

   LGPD — Exportar / Excluir minha conta
══════════════════════════════════════ */
async function exportarMeusDados() {
  const { data, error } = await sb.rpc('export_my_data');
  if (error) { alert('Erro ao exportar: ' + error.message); return; }
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `meus-dados-eip-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

async function excluirMinhaConta() {
  const conf = prompt(
    'Esta ação é IRREVERSÍVEL.\n\n' +
    'Todos os seus dados (perfil, progresso, notas, comentários) serão excluídos.\n\n' +
    'Digite "EXCLUIR" (em maiúsculas) para confirmar:'
  );
  if (conf !== 'EXCLUIR') {
    alert('Cancelado. Sua conta NÃO foi excluída.');
    return;
  }
  const { error } = await sb.rpc('delete_my_account');
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  await sb.auth.signOut();
  alert('Conta excluída. Você será redirecionado.');
  window.location.href = '/Landing.html';
}

async function resetSenha(userId, email, nome) {
  if (!userId) { alert('ID de usuário não disponível.'); return; }

  /* Gera a senha padrão: 2 iniciais do e-mail em maiúsculo + "edit2026" */
  const prefix   = (email || '').split('@')[0].slice(0, 2).toUpperCase();
  const novaSenha = prefix + 'edit2026';

  const confirmMsg =
    `Redefinir senha de ${nome || email}?\n\n` +
    `Nova senha padrão: ${novaSenha}\n\n` +
    `Anote esta senha para repassar ao usuário após confirmar.`;

  if (!confirm(confirmMsg)) return;

  const { error } = await sb.rpc('admin_reset_password', {
    p_user_id:    userId,
    p_new_password: novaSenha
  });

  if (error) { alert('Erro ao redefinir senha: ' + error.message); return; }

  alert(
    `✓ Senha redefinida com sucesso!\n\n` +
    `Usuário: ${nome || email}\n` +
    `Nova senha: ${novaSenha}\n\n` +
    `Repasse esta senha ao usuário.`
  );
}
</script>
</html>
