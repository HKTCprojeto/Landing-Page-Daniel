<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Executive Import Program</title>
<meta name="theme-color" content="#0a1f3a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  /* ═══ TOKENS DE TEMA ═══ */
  :root {
    --navy:#0a1f3a; --navy-2:#0f2a4a; --navy-3:#15396b;
    --blue:#2b6fb5; --accent:#c8102e; --green:#15803d;
    --sidebar-w:260px;
    --bg:#f6f8fb; --bg2:#eef2f7; --card:#ffffff; --border:#e3e8ef;
    --text:#0e1620; --text2:#1c2733; --muted:#5b6b7d;
    --topbar-bg:#ffffff; --input-bg:#f6f8fb;
    --badge-lock-bg:#f1f5f9; --badge-lock-clr:#5b6b7d;
    --badge-open-bg:#eff6ff; --badge-open-clr:#2b6fb5;
    --btn-ap-hover-bg:#eff6ff;
  }
  [data-theme="dark"] {
    --bg:#08172a; --bg2:#0a1f3a; --card:#0f2a4a; --border:rgba(255,255,255,.09);
    --text:#dde6f0; --text2:#b8cfe8; --muted:#7a97b6;
    --topbar-bg:#091829; --input-bg:#0a1f3a;
    --badge-lock-bg:rgba(255,255,255,.06); --badge-lock-clr:#7a97b6;
    --badge-open-bg:rgba(43,111,181,.2); --badge-open-clr:#7eb8f5;
    --btn-ap-hover-bg:rgba(43,111,181,.15);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;transition:background .25s,color .25s}

  /* ═══ SIDEBAR ═══ */
  .sidebar{width:var(--sidebar-w);background:var(--navy);min-height:100vh;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .25s ease}
  .sidebar-brand{display:flex;align-items:center;gap:11px;padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}
  .brand-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2b6fb5,#15396b);display:grid;place-items:center;flex-shrink:0;font-family:'Fraunces',serif;font-size:12px;font-weight:700;color:#fff;letter-spacing:.04em}
  .brand-text strong{display:block;font-size:13px;font-weight:700;color:#fff;line-height:1.2}
  .brand-text span{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.07em;text-transform:uppercase}
  .user-chip{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:700;color:#fff}
  .user-info{overflow:hidden;flex:1}
  .user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-email{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .role-pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .role-pill.admin{background:rgba(200,16,46,.3);color:#fca5a5}
  .role-pill.user{background:rgba(43,111,181,.25);color:#93c5fd}
  .nav{flex:1;padding:16px 12px;overflow-y:auto}
  .nav-section{margin-bottom:24px}
  .nav-section-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:0 8px;margin-bottom:6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;text-decoration:none;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;transition:background .15s,color .15s;user-select:none}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:rgba(43,111,181,.35);color:#fff}
  .nav-item .icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
  .sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
  .btn-logout{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.45);font-family:'Manrope',sans-serif;font-size:14px;font-weight:500;transition:background .15s,color .15s}
  .btn-logout:hover{background:rgba(200,16,46,.2);color:#f87171}
  .btn-logout .icon{font-size:17px;width:22px;text-align:center}
  .menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

  /* ═══ MAIN ═══ */
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:var(--topbar-bg);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;transition:background .25s,border-color .25s}
  .page-title{font-size:17px;font-weight:700;color:var(--text)}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .topbar-user{font-size:13px;color:var(--muted)}
  .admin-badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(200,16,46,.12);color:#c8102e;border:1px solid rgba(200,16,46,.25)}
  [data-theme="dark"] .admin-badge{background:rgba(200,16,46,.2);color:#fca5a5;border-color:rgba(200,16,46,.35)}
  .theme-toggle{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:5px 12px;cursor:pointer;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:var(--text);transition:background .2s,border-color .2s,color .2s;user-select:none}
  .theme-toggle:hover{border-color:var(--blue);color:var(--blue)}
  .theme-toggle .t-icon{font-size:15px;line-height:1}
  .content{padding:32px;flex:1}
  .section{display:none}
  .section.active{display:block}

  /* ═══ HOME ═══ */
  .welcome-header{margin-bottom:28px}
  .welcome-header h1{font-family:'Fraunces',serif;font-size:28px;color:var(--text);margin-bottom:6px}
  .welcome-header p{font-size:15px;color:var(--muted)}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .dash-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:22px;cursor:pointer;transition:box-shadow .15s,transform .15s,background .25s}
  .dash-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
  .dash-card .card-icon{font-size:28px;margin-bottom:12px}
  .dash-card .card-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
  .dash-card .card-desc{font-size:12px;color:var(--muted)}

  /* ═══ APOSTILAS ═══ */
  .section-header{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .section-header-text h2{font-family:'Fraunces',serif;font-size:24px;color:var(--text);margin-bottom:4px}
  .section-header-text p{font-size:14px;color:var(--muted)}
  .btn-add-modulo{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;flex-shrink:0}
  .btn-add-modulo:hover{background:#1d5fa0}
  .apostilas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .apostila-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s,background .25s}
  .apostila-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
  .apostila-cover{aspect-ratio:3/2;border-radius:8px;background:linear-gradient(135deg,var(--navy-2),var(--navy-3));display:flex;align-items:center;justify-content:center;font-size:36px}
  .apostila-title{font-size:15px;font-weight:700;color:var(--text)}
  .apostila-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;width:fit-content}
  .badge-locked{background:var(--badge-lock-bg);color:var(--badge-lock-clr)}
  .badge-open{background:var(--badge-open-bg);color:var(--badge-open-clr)}
  .btn-apostila{padding:10px 14px;border-radius:8px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:none;color:var(--text);cursor:pointer;text-align:center;transition:border-color .15s,background .15s,color .15s}
  .btn-apostila:hover:not(:disabled){border-color:var(--blue);background:var(--btn-ap-hover-bg);color:var(--blue)}
  .btn-apostila:disabled{opacity:.5;cursor:not-allowed}
  /* Admin actions */
  .admin-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--border)}
  .btn-ap-adm{flex:1;padding:6px 4px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'Manrope',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:3px}
  .btn-ap-adm:hover{border-color:var(--blue);color:var(--blue);background:var(--btn-ap-hover-bg)}
  .btn-ap-adm.danger:hover{border-color:#dc2626;color:#dc2626;background:rgba(220,38,38,.08)}

  /* ═══ PERFIL ═══ */
  .perfil-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:28px;max-width:520px;transition:background .25s}
  .perfil-avatar-wrap{position:relative;width:80px;height:80px;margin-bottom:14px;flex-shrink:0}
  .perfil-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;overflow:hidden;transition:opacity .2s}
  .perfil-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .perfil-avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:opacity .2s;cursor:pointer}
  .perfil-avatar-wrap:hover .perfil-avatar-overlay{opacity:1}
  .avatar-actions{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .btn-av{padding:6px 14px;border-radius:7px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid var(--border);background:none;color:var(--muted);display:flex;align-items:center;gap:5px}
  .btn-av:hover{border-color:var(--blue);color:var(--blue)}
  .btn-av.danger{border-color:rgba(220,38,38,.4);color:#dc2626}
  .btn-av.danger:hover{background:rgba(220,38,38,.08)}
  .av-uploading{opacity:.5;pointer-events:none}
  .perfil-name{font-family:'Fraunces',serif;font-size:22px;color:var(--text);margin-bottom:4px}
  .perfil-email{font-size:14px;color:var(--muted);margin-bottom:24px}
  .perfil-fields{display:flex;flex-direction:column;gap:14px}
  .perfil-field label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
  .perfil-field .value{padding:11px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--text);transition:background .25s,border-color .25s}
  .perfil-input{width:100%;padding:11px 14px;background:var(--input-bg);border:1.5px solid var(--border);border-radius:8px;font-family:'Manrope',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .25s}
  .perfil-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,111,181,.12)}
  .perfil-input.ok{border-color:var(--green)}
  .perfil-input.err{border-color:#dc2626}
  .value.readonly{opacity:.65;cursor:default;user-select:none}
  .pfmsg{font-size:12px;margin-top:4px;min-height:15px}
  .pfmsg.ok{color:var(--green)}
  .pfmsg.err{color:#dc2626}
  .btn-salvar-perfil{padding:11px 24px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
  .btn-salvar-perfil:hover{background:#1d5fa0}
  .btn-salvar-perfil:disabled{opacity:.6;cursor:not-allowed}
  .perfil-status{font-size:13px;font-weight:600}
  .perfil-status.ok{color:var(--green)}
  .perfil-status.err{color:#dc2626}

  /* ═══ CONFIGURAÇÕES ═══ */
  .config-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content}
  .config-tab{padding:8px 18px;border-radius:7px;border:none;background:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .config-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .config-tab:hover:not(.active){color:var(--text)}
  .config-pane{display:none}
  .config-pane.active{display:block}
  .config-section-title{font-family:'Fraunces',serif;font-size:18px;color:var(--text);margin-bottom:16px}
  .table-wrap{border-radius:12px;border:1px solid var(--border);overflow:hidden;overflow-x:auto}
  .users-table{width:100%;border-collapse:collapse;min-width:620px}
  .users-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
  .users-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
  .users-table tr:last-child td{border-bottom:none}
  .users-table tbody tr:hover td{background:var(--bg2)}
  .user-cell{display:flex;align-items:center;gap:10px}
  .av-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#15396b);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
  .sel-field{padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-family:'Manrope',sans-serif;font-size:12px;cursor:pointer;outline:none}
  .sel-field:focus{border-color:var(--blue)}
  .btn-reset{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'Manrope',sans-serif;transition:all .15s;white-space:nowrap}
  .btn-reset:hover{border-color:var(--blue);color:var(--blue)}
  .btn-desativar{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'Manrope',sans-serif;transition:all .15s;white-space:nowrap}
  .btn-desativar:hover{border-color:#dc2626;color:#dc2626}
  .btn-ativar{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid rgba(21,128,61,.4);background:none;color:var(--green);cursor:pointer;font-family:'Manrope',sans-serif;transition:all .15s;white-space:nowrap}
  .btn-ativar:hover{background:rgba(21,128,61,.08)}
  .row-inativo td{opacity:.45}
  .row-inativo td:last-child{opacity:1}
  .status-ativo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(21,128,61,.12);color:#15803d}
  .status-ativo::before{content:'';width:5px;height:5px;border-radius:50%;background:#15803d}
  .status-inativo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(220,38,38,.1);color:#dc2626}
  .status-inativo::before{content:'';width:5px;height:5px;border-radius:50%;background:#dc2626}
  [data-theme="dark"] .status-ativo{background:rgba(74,222,128,.12);color:#4ade80}
  [data-theme="dark"] .status-ativo::before{background:#4ade80}
  .btn-cad-user{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
  .btn-cad-user:hover{background:#1d5fa0}
  .plano-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .plano-basico{background:var(--badge-lock-bg);color:var(--badge-lock-clr)}
  .plano-premium{background:rgba(234,179,8,.15);color:#d97706}
  .plano-vitalicio{background:rgba(21,128,61,.15);color:#15803d}
  [data-theme="dark"] .plano-premium{color:#fbbf24}
  [data-theme="dark"] .plano-vitalicio{color:#4ade80}

  /* ═══ API CARDS ═══ */
  .api-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .api-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,background .25s}
  .api-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .api-card-top{display:flex;align-items:flex-start;gap:14px}
  .api-logo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0;font-weight:700}
  .api-logo.supabase{background:linear-gradient(135deg,#3ecf8e22,#3ecf8e44);color:#3ecf8e;border:1px solid #3ecf8e44}
  .api-logo.vercel{background:linear-gradient(135deg,#ffffff22,#ffffff11);color:var(--text);border:1px solid var(--border)}
  .api-logo.gfonts{background:linear-gradient(135deg,#4285f422,#4285f444);color:#4285f4;border:1px solid #4285f444}
  .api-logo.supabasejs{background:linear-gradient(135deg,#3ecf8e11,#3ecf8e33);color:#3ecf8e;border:1px solid #3ecf8e33}
  .api-info{flex:1;min-width:0}
  .api-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
  .api-type{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .api-status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;flex-shrink:0;align-self:flex-start}
  .api-status.ok{background:rgba(21,128,61,.12);color:#15803d}
  .api-status.ok::before{content:'';width:6px;height:6px;border-radius:50%;background:#15803d;display:inline-block}
  [data-theme="dark"] .api-status.ok{background:rgba(74,222,128,.12);color:#4ade80}
  [data-theme="dark"] .api-status.ok::before{background:#4ade80}
  .api-desc{font-size:13px;color:var(--muted);line-height:1.6}
  .api-endpoint{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:monospace;color:var(--muted);overflow:hidden}
  .api-endpoint span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .api-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .api-tags{display:flex;gap:6px;flex-wrap:wrap}
  .api-tag{padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--badge-open-bg);color:var(--badge-open-clr)}
  .api-link{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px;transition:opacity .15s;flex-shrink:0}
  .api-link:hover{opacity:.75}

  /* ═══ MODAL APOSTILA (admin) ═══ */
  .modal-overlay{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--card);border-radius:16px;padding:28px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .modal-title{font-family:'Fraunces',serif;font-size:20px;color:var(--text);margin-bottom:20px}
  .mrow{margin-bottom:14px}
  .mrow label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .minp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Manrope',sans-serif;font-size:14px;color:var(--text);background:var(--input-bg);outline:none;transition:border-color .15s}
  .minp:focus{border-color:var(--blue)}
  .mcheck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer}
  .mcheck input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
  .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .btn-mcancel{padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:none;color:var(--text);cursor:pointer;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600}
  .btn-mcancel:hover{border-color:var(--blue)}
  .btn-msave{padding:10px 22px;border-radius:8px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700}
  .btn-msave:hover{background:#1d5fa0}
  .btn-msave:disabled{opacity:.6;cursor:not-allowed}

  /* ═══ FÓRUM / TIRE SUA DÚVIDA ═══ */
  .topicos-list{display:flex;flex-direction:column;gap:10px}
  .topico-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;gap:14px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s}
  .topico-card:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
  .topico-card.fixado{border-left:4px solid #f59e0b}
  .topico-card.resolvido{border-left:4px solid #15803d}
  .topico-card.fechado{opacity:.6}
  .topico-av{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;overflow:hidden}
  .topico-av img{width:100%;height:100%;object-fit:cover}
  .topico-body{flex:1;min-width:0}
  .topico-head-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .topico-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
  .topico-tag.fixado{background:rgba(245,158,11,.15);color:#d97706}
  .topico-tag.resolvido{background:rgba(21,128,61,.15);color:#15803d}
  .topico-tag.fechado{background:var(--badge-lock-bg);color:var(--badge-lock-clr)}
  [data-theme="dark"] .topico-tag.fixado{color:#fbbf24}
  [data-theme="dark"] .topico-tag.resolvido{color:#4ade80}
  .topico-titulo{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:3px;word-break:break-word}
  .topico-preview{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
  .topico-meta{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .topico-meta strong{color:var(--text);font-weight:600}
  .topico-stats{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;min-width:60px;text-align:center}
  .topico-stats-num{font-family:'Fraunces',serif;font-size:22px;color:var(--text);font-weight:600;line-height:1}
  .topico-stats-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .topicos-empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--bg2);border-radius:14px;border:2px dashed var(--border)}
  .topicos-empty-icon{font-size:42px;opacity:.4;margin-bottom:6px}

  /* Modal de visualização */
  .topico-view-head{padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .topico-view-tipo{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .topico-autor-row{display:flex;align-items:center;gap:10px}
  .topico-view-actions{display:flex;gap:6px;flex-wrap:wrap}
  .topico-view-actions button{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;transition:all .12s}
  .topico-view-actions button:hover{border-color:var(--blue);color:var(--blue)}
  .topico-view-actions button.danger:hover{border-color:#dc2626;color:#dc2626}
  .topico-view-actions button.solucao{border-color:rgba(21,128,61,.5);color:#15803d}
  .topico-view-actions button.solucao:hover{background:rgba(21,128,61,.08)}
  [data-theme="dark"] .topico-view-actions button.solucao{color:#4ade80;border-color:rgba(74,222,128,.5)}
  .topico-view-texto{font-size:14.5px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word;padding:10px 14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border)}
  .topico-respostas-list{display:flex;flex-direction:column;gap:10px}
  .resposta-item{display:flex;gap:10px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;transition:border-color .15s}
  .resposta-item.solucao{border-color:#15803d;background:linear-gradient(135deg,rgba(21,128,61,.06),transparent)}
  [data-theme="dark"] .resposta-item.solucao{border-color:#4ade80;background:linear-gradient(135deg,rgba(74,222,128,.07),transparent)}
  .resposta-solucao-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:rgba(21,128,61,.15);color:#15803d;margin-bottom:4px}
  [data-theme="dark"] .resposta-solucao-tag{color:#4ade80}
  .resposta-acoes{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .resposta-acoes button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;padding:0;transition:color .12s}
  .resposta-acoes button:hover{color:var(--blue)}
  .resposta-acoes button.danger:hover{color:#dc2626}
  .resposta-acoes button.solucao:hover{color:#15803d}
  [data-theme="dark"] .resposta-acoes button.solucao:hover{color:#4ade80}

  /* ═══ CERTIFICADOS ═══ */
  .cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .cert-card{background:linear-gradient(135deg,#fff,#fafafa);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
  [data-theme="dark"] .cert-card{background:linear-gradient(135deg,#0f2a4a,#15396b);border-color:rgba(255,255,255,.1)}
  .cert-card.locked{opacity:.55;filter:saturate(.4)}
  .cert-card:hover:not(.locked){transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
  .cert-card::before{content:'';position:absolute;top:-24px;right:-24px;width:80px;height:80px;background:radial-gradient(circle,rgba(245,158,11,.15) 0%,transparent 70%);pointer-events:none}
  .cert-card.programa{background:linear-gradient(135deg,#0a1f3a,#15396b);color:#fff;border-color:rgba(245,158,11,.4)}
  .cert-card.programa::before{background:radial-gradient(circle,rgba(245,158,11,.4) 0%,transparent 70%);width:120px;height:120px;top:-40px;right:-40px}
  .cert-seal{font-size:42px;text-align:center;line-height:1;margin-top:4px}
  .cert-tipo{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
  .cert-card.programa .cert-tipo{color:#fbbf24}
  .cert-titulo{font-family:'Fraunces',serif;font-size:18px;color:var(--text);text-align:center;line-height:1.3;font-weight:600}
  .cert-card.programa .cert-titulo{color:#fff}
  .cert-data{font-size:12px;color:var(--muted);text-align:center}
  .cert-card.programa .cert-data{color:rgba(255,255,255,.7)}
  .cert-actions{display:flex;gap:8px;margin-top:auto}
  .cert-actions button{flex:1;padding:9px;border-radius:8px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;border:1px solid var(--border);background:none;color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
  .cert-actions button:hover{border-color:var(--blue);color:var(--blue);background:var(--btn-ap-hover-bg)}
  .cert-actions button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .cert-actions button.primary:hover{background:#1d5fa0;color:#fff}
  .cert-card.programa .cert-actions button{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.06)}
  .cert-card.programa .cert-actions button:hover{background:rgba(245,158,11,.2);border-color:#fbbf24;color:#fbbf24}
  .cert-card.programa .cert-actions button.primary{background:#fbbf24;color:#0a1f3a;border-color:#fbbf24}
  .cert-card.programa .cert-actions button.primary:hover{background:#f59e0b;border-color:#f59e0b;color:#0a1f3a}
  .cert-locked-msg{font-size:11px;color:var(--muted);text-align:center;font-style:italic;margin-top:auto;padding-top:6px}
  .cert-progress-banner{background:linear-gradient(135deg,var(--badge-open-bg),transparent);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .cert-progress-info{flex:1;min-width:200px}
  .cert-progress-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .cert-progress-text{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
  .cert-progress-bar-wrap{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:4px}
  .cert-progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f59e0b);border-radius:99px;transition:width .5s ease}
  .cert-empty{text-align:center;padding:48px 24px;color:var(--muted);background:var(--bg2);border-radius:14px;border:2px dashed var(--border)}
  .cert-empty-icon{font-size:48px;opacity:.4;margin-bottom:8px}
  .cert-empty-title{font-family:'Fraunces',serif;font-size:20px;color:var(--text);margin-bottom:6px}

  /* ═══ AULAS (vídeos) ═══ */
  .aulas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .aula-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s,background .25s}
  .aula-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
  .aula-thumb{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,var(--navy-2),var(--navy-3));display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .aula-thumb img{width:100%;height:100%;object-fit:cover}
  .aula-thumb .play-icon{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;backdrop-filter:blur(2px);transition:transform .15s,background .15s}
  .aula-thumb:hover .play-icon{background:var(--accent);transform:scale(1.08)}
  .aula-thumb.locked{cursor:not-allowed;opacity:.55}
  .aula-thumb.locked .play-icon{background:rgba(0,0,0,.4)}
  .aula-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
  .aula-desc{font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ═══ VIDEO PLAYER ═══ */
  .video-overlay{display:none;position:fixed;inset:0;z-index:550;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .video-overlay.open{display:flex}
  /* O modal cresce conforme o conteúdo; a rolagem fica no overlay */
  .video-modal{background:#000;border-radius:14px;width:100%;max-width:1100px;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.6);margin:auto}
  .video-header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  .video-header-info{flex:1;min-width:0}
  .video-header-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .video-header-num{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
  /* Player wrapper — usa padding-top dinâmico pra fixar o aspect 16:9
     com cap em 60vh; filhos são absolutos pra que o YT.Player NUNCA
     estoure e empurre o painel de notas/comentários. */
  .video-frame-wrap{
    position:relative;background:#000;width:100%;
    height:0;padding-top:min(56.25%, 60vh);
    overflow:hidden;flex-shrink:0
  }
  .video-frame-wrap > video.video-frame,
  .video-frame-wrap > #yt-frame{
    position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;outline:none;border:0
  }
  .video-frame-wrap > #yt-frame iframe{
    width:100%!important;height:100%!important;border:0!important;display:block
  }
  .video-controls{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap}
  .vctrl{position:relative}
  .vctrl-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s}
  .vctrl-btn:hover{border-color:var(--blue);color:var(--blue)}
  .vctrl-btn .caret{font-size:9px;opacity:.6}
  .vctrl-menu{display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:140px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:10}
  .vctrl-menu.open{display:block}
  .vctrl-menu-item{padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:background .12s}
  .vctrl-menu-item:hover{background:var(--bg2)}
  .vctrl-menu-item.active{background:var(--badge-open-bg);color:var(--badge-open-clr);font-weight:700}
  .vctrl-menu-item .check{font-size:11px;opacity:0}
  .vctrl-menu-item.active .check{opacity:1}
  .video-desc-box{padding:14px 18px;background:var(--card);border-top:1px solid var(--border);font-size:13px;color:var(--muted);line-height:1.55;max-height:140px;overflow-y:auto}
  .btn-video-close{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:#c8102e;color:#fff;border:none;cursor:pointer;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;transition:background .15s}
  .btn-video-close:hover{background:#a40d26}

  /* ═══ PROGRESSO ═══ */
  .video-progress-bar{height:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
  .video-progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .3s}
  .aula-progress{height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:4px}
  .aula-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px;transition:width .3s}
  .aula-pct{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .aula-concluida-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(21,128,61,.15);color:#15803d}
  [data-theme="dark"] .aula-concluida-tag{background:rgba(74,222,128,.15);color:#4ade80}

  /* ═══ "Continuar assistindo" — home ═══ */
  .continue-card{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));border-radius:14px;padding:22px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .continue-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
  .continue-thumb{width:120px;aspect-ratio:16/9;border-radius:8px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-size:32px}
  .continue-thumb img{width:100%;height:100%;object-fit:cover}
  .continue-info{flex:1;min-width:0}
  .continue-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:4px}
  .continue-title{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .continue-progress{height:5px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:8px}
  .continue-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#ff6b85);border-radius:99px}
  .continue-pct{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px}

  /* ═══ NOTAS / COMENTÁRIOS — painel lateral ═══ */
  .video-side-panel{padding:0 18px 18px;background:var(--card);border-top:1px solid var(--border);flex:1;min-height:0}
  .vsp-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;align-items:flex-end;flex-wrap:wrap}
  .vsp-tab{padding:11px 14px;border:none;background:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
  .vsp-tab.active{color:var(--text);border-bottom-color:var(--blue)}
  .vsp-tab:hover:not(.active){color:var(--text)}
  .vsp-pane{display:none}
  .vsp-pane.active{display:block}
  .vsp-empty{font-size:13px;color:var(--muted);padding:18px 0;text-align:center}
  .notas-list{display:flex;flex-direction:column;gap:8px}
  .nota-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s}
  .nota-item:hover{border-color:var(--blue)}
  .nota-tempo{flex-shrink:0;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:monospace}
  .nota-tempo:hover{background:#1d5fa0}
  .nota-texto{flex:1;font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .nota-actions{display:flex;gap:4px;flex-shrink:0}
  .nota-actions button{background:none;border:none;color:var(--muted);cursor:pointer;padding:3px 6px;font-size:13px;border-radius:5px;transition:color .15s,background .15s}
  .nota-actions button:hover{background:var(--card);color:var(--blue)}
  .nota-actions button.danger:hover{color:#dc2626}
  .coment-form{margin-bottom:18px;background:var(--bg2);padding:12px;border-radius:10px;border:1px solid var(--border)}
  .coment-form textarea{min-height:70px;background:var(--card);width:100%;display:block;resize:vertical;max-width:100%;box-sizing:border-box}
  .coment-form-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
  .coment-form-actions span{flex:1;text-align:left;min-width:0}
  .coment-form-actions button{flex-shrink:0}
  .coments-list{display:flex;flex-direction:column;gap:12px}
  .coment-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);min-width:0}
  .coment-item:last-child{border-bottom:none}
  .coment-replies{margin-left:46px;border-left:2px solid var(--border);padding-left:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px;min-width:0}
  .coment-replies .coment-item{padding:6px 0;border-bottom:none}
  .coment-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
  .coment-av img{width:100%;height:100%;object-fit:cover}
  .coment-body{flex:1;min-width:0}

function _setAllAvatars(html) {
  ['pf-av','sidebar-av'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  });
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('Imagem muito grande. Máximo 10 MB.'); return; }

  const ext   = file.name.split('.').pop().toLowerCase();
  const valid = ['jpg','jpeg','png','webp'];
  if (!valid.includes(ext)) { alert('Use JPG, PNG ou WEBP.'); return; }

  /* Loading visual */
  const wrap = document.querySelector('.perfil-avatar-wrap');
  if (wrap) wrap.classList.add('av-uploading');

  const path = `${_currentUserId}/avatar.${ext}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true });

  if (upErr) {
    alert('Erro ao enviar foto: ' + upErr.message);
    wrap?.classList.remove('av-uploading');
    event.target.value = '';
    return;
  }

  const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
  await sb.from('perfis').update({ avatar_url: publicUrl }).eq('id', _currentUserId);
  _currentAvatarUrl = publicUrl;

  const urlTs = publicUrl + '?t=' + Date.now();
  _setAllAvatars(`<img src="${urlTs}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`);

  const btnRem = document.getElementById('btn-remover-foto');
  if (btnRem) btnRem.style.display = '';

  wrap?.classList.remove('av-uploading');
  event.target.value = '';
}

async function removerFoto() {
  if (!confirm('Remover foto de perfil?')) return;

  /* Tenta deletar do storage */
  if (_currentAvatarUrl) {
    const stored = _currentAvatarUrl.split('/avatars/')[1]?.split('?')[0];
    if (stored) await sb.storage.from('avatars').remove([stored]);
  }

  await sb.from('perfis').update({ avatar_url: null }).eq('id', _currentUserId);
  _currentAvatarUrl = null;

  const ini = initials(formatNome(document.getElementById('pf-nm')?.textContent || ''));
  _setAllAvatars(ini);

  const btnRem = document.getElementById('btn-remover-foto');
  if (btnRem) btnRem.style.display = 'none';
}

/* ══════════════════════════════════════
   PERFIL — EDIÇÃO
══════════════════════════════════════ */
function maskCPF_pf(v) {
  return v.replace(/\D/g,'').slice(0,11)
    .replace(/(\d{3})(\d)/,'$1.$2')
    .replace(/(\d{3})(\d)/,'$1.$2')
    .replace(/(\d{3})(\d{1,2})$/,'$1-$2');
}
function cpfValido(c) {
  c = c.replace(/\D/g,'');
  if (c.length!==11 || /^(\d)\1+$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s += +c[i]*(10-i);
  let r=(s*10)%11; if(r>=10)r=0; if(r!==+c[9]) return false;
  s=0; for(let i=0;i<10;i++) s += +c[i]*(11-i);
  r=(s*10)%11; if(r>=10)r=0; return r===+c[10];
}
function setPf(id, mid, ok, msg) {
  const el=document.getElementById(id), m=document.getElementById(mid);
  if(el){ el.classList.toggle('ok', ok===true); el.classList.toggle('err', ok===false); }
  if(m) { m.className='pfmsg '+(ok===true?'ok':ok===false?'err':''); m.textContent=msg||''; }
}
function validatePfNome() {
  const v=document.getElementById('pf-nome')?.value.trim()||'';
  if (!v)                          { setPf('pf-nome','pm-nome',false,'Nome obrigatório.'); return false; }
  if (v.split(/\s+/).length < 2)   { setPf('pf-nome','pm-nome',false,'Informe nome e sobrenome.'); return false; }
  if (!/^[\p{L}\s]+$/u.test(v))    { setPf('pf-nome','pm-nome',false,'Apenas letras e espaços.'); return false; }
  setPf('pf-nome','pm-nome',true,''); return true;
}
function validatePfEmail() {
  const v=document.getElementById('pf-email')?.value.trim()||'';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { setPf('pf-email','pm-email',false,'E-mail inválido.'); return false; }
  setPf('pf-email','pm-email',true,''); return true;
}
function validatePfCpf() {
  const v=document.getElementById('pf-cpf')?.value||'';
  if (!v.replace(/\D/g,'')) { setPf('pf-cpf','pm-cpf',null,''); return true; } // CPF vazio é aceito
  if (!cpfValido(v))        { setPf('pf-cpf','pm-cpf',false,'CPF inválido. Verifique os dígitos.'); return false; }
  setPf('pf-cpf','pm-cpf',true,'CPF válido ✓'); return true;
}

async function salvarPerfil() {
  if (!validatePfNome() | !validatePfEmail() | !validatePfCpf()) return; // | para validar todos

  const btn    = document.getElementById('btn-salvar-perfil');
  const status = document.getElementById('perfil-status');
  btn.disabled = true; btn.textContent = 'Salvando…';
  status.className = 'perfil-status'; status.textContent = '';

  const novoNome  = document.getElementById('pf-nome').value.trim();
  const novoEmail = document.getElementById('pf-email').value.trim();
  const novoCpf   = document.getElementById('pf-cpf').value.replace(/\D/g,'') || null;

  const { data:{ user:curUser } } = await sb.auth.getUser();
  const emailChanged = novoEmail !== curUser.email;

  /* Salva nome e CPF na tabela perfis */
  const { error: perfilErr } = await sb.from('perfis')
    .update({ nome: novoNome, cpf: novoCpf })
    .eq('id', curUser.id);

  if (perfilErr) {
    btn.disabled=false; btn.textContent='Salvar alterações';
    status.className='perfil-status err'; status.textContent='Erro ao salvar: '+perfilErr.message;
    return;
  }

  /* Se o e-mail mudou, atualiza via Supabase Auth (envia confirmação) */
  if (emailChanged) {
    const { error: emailErr } = await sb.auth.updateUser({ email: novoEmail });
    if (emailErr) {
      btn.disabled=false; btn.textContent='Salvar alterações';
      status.className='perfil-status err'; status.textContent='Erro no e-mail: '+emailErr.message;
      return;
    }
  }

  /* Atualiza o display do card */
  const nf = formatNome(novoNome);
  const av = initials(nf);
  const pfNm = document.getElementById('pf-nm');
  const pfEm = document.getElementById('pf-em');
  if (pfNm) pfNm.textContent = nf;
  if (pfEm) pfEm.textContent = novoEmail;
  /* Atualiza nome na sidebar */
  const sideName = document.querySelector('.user-chip .user-name');
  if (sideName) sideName.textContent = nf;
  /* Atualiza iniciais apenas se não tiver foto; preserva a foto se houver */
  if (!_currentAvatarUrl) _setAllAvatars(av);

  btn.disabled=false; btn.textContent='Salvar alterações';
  status.className='perfil-status ok';
  status.textContent = emailChanged
    ? '✓ Salvo! Confirme o novo e-mail na sua caixa de entrada.'
    : '✓ Perfil atualizado com sucesso!';
  setTimeout(()=>{ status.textContent=''; status.className='perfil-status'; }, 5000);
}

        ${m.disponivel&&m.pdf_path?'Ler apostila':'Aguardando liberação'}
      </button>
      ${m.disponivel ? `
        <button class="btn-avaliar ${fb?'avaliado':''}" onclick="abrirModalFeedback('apostila',${m.id},'${escapeHtml(m.titulo||'').replace(/'/g,"\\'")}','${escapeHtml(m.num||'').replace(/'/g,"\\'")}')" title="${fb?'Sua nota: '+fb.nota+' / 5 — clique para ver/editar':'Avaliar este módulo'}">
          ${fb ? `<span class="mini-stars">${'★'.repeat(fb.nota)}${'☆'.repeat(5-fb.nota)}</span>` : '⭐ Avaliar agora'}

      </div>` : ''}

async function recarregarApostilas() {
  const { data } = await sb.from('apostilas').select('*').order('ordem');
  const isAdmin = _apostilasCache.length > 0
    ? document.getElementById('apostilas-grid')?.querySelector('.admin-actions') !== null
    : false;

   APOSTILAS — ADMIN CRUD
══════════════════════════════════════ */
let _editingId = null;

function abrirModalApostila(id = null) {
  _editingId = id;
  document.getElementById('modal-apostila-title').textContent = id ? 'Editar Módulo' : 'Novo Módulo';
  if (id) {
    const m = _apostilasCache.find(a => a.id === id);
    if (m) {
      document.getElementById('m-num').value       = m.num || '';
      document.getElementById('m-titulo').value    = m.titulo || '';
      document.getElementById('m-emoji').value     = m.emoji || '';
      document.getElementById('m-thumb').value     = m.thumb_url || '';
      document.getElementById('m-pdf').value       = m.pdf_path || '';
      document.getElementById('m-disponivel').checked = !!m.disponivel;
    }
  } else {
    document.getElementById('m-num').value       = '';
    document.getElementById('m-titulo').value    = '';
    document.getElementById('m-emoji').value     = '📘';
    document.getElementById('m-thumb').value     = '';
    document.getElementById('m-pdf').value       = '';
    document.getElementById('m-disponivel').checked = false;
  }
  /* Liga handlers e renderiza preview da thumb */
  _bindThumbHandlers();
  const tFile = document.getElementById('m-thumb-file');
  if (tFile) tFile.value = '';
  const tStatus = document.getElementById('m-thumb-status');
  if (tStatus) { tStatus.textContent = 'JPG/PNG/WEBP até 15 MB. Ou cole a URL abaixo.'; tStatus.style.color = ''; }
  _renderThumbPreview('m', document.getElementById('m-thumb').value);
  document.getElementById('modal-apostila').classList.add('open');
}
function fecharModalApostila() {
  document.getElementById('modal-apostila').classList.remove('open');
  _editingId = null;
}

async function salvarApostila() {
  const btn = document.getElementById('btn-msave');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const payload = {
    num:       document.getElementById('m-num').value.trim(),
    titulo:    document.getElementById('m-titulo').value.trim(),
    emoji:     document.getElementById('m-emoji').value.trim() || '📘',
    thumb_url: document.getElementById('m-thumb').value.trim() || null,
    pdf_path:  document.getElementById('m-pdf').value.trim() || null,
    disponivel:document.getElementById('m-disponivel').checked,
  };
  if (!payload.num || !payload.titulo) {
    alert('Número e título são obrigatórios.');
    btn.disabled = false; btn.textContent = 'Salvar'; return;
  }
  let error;
  if (_editingId) {
    ({ error } = await sb.from('apostilas').update(payload).eq('id', _editingId));
  } else {
    const maxOrdem = _apostilasCache.length ? Math.max(..._apostilasCache.map(a=>a.ordem||0)) : 0;
    ({ error } = await sb.from('apostilas').insert({ ...payload, ordem: maxOrdem + 1 }));
  }
  btn.disabled = false; btn.textContent = 'Salvar';
  if (error) { alert('Erro: ' + error.message); return; }
  fecharModalApostila();
  await recarregarApostilas();
}

async function deletarApostila(id) {
  if (!confirm('Excluir este módulo? Esta ação não pode ser desfeita.')) return;
  const { error } = await sb.from('apostilas').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await recarregarApostilas();
}

async function toggleDisponivel(id, current) {
  const { error } = await sb.from('apostilas').update({ disponivel: !current }).eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await recarregarApostilas();
}

/* ══════════════════════════════════════
   PDF VIEWER
══════════════════════════════════════ */
let _currentApostila = null;     // { id, titulo, num }
let _apostilaTimer   = null;
let _apostilaTickAccum = 0;      // segundos acumulados nesta sessão

function abrirPDF(src, idOrNum, num, titulo) {
  /* Compat: assinatura antiga (src, num, titulo) sem id.
     Quando id é uma string e num/titulo undefined, é a chamada antiga. */
  let apostilaId = null;
  if (typeof idOrNum === 'number') {
    apostilaId = idOrNum;
  } else {
    /* chamada antiga: (src, num, titulo) */
    titulo = num;
    num    = idOrNum;
  }
  const ap = apostilaId ? _apostilasCache.find(a => a.id === apostilaId) : null;
  _currentApostila = ap ? { id: ap.id, titulo: ap.titulo, num: ap.num } : null;
  _apostilaTickAccum = 0;

  document.getElementById('pdf-num').textContent       = num || '';
  document.getElementById('pdf-title-lbl').textContent = titulo || '';
  document.getElementById('pdf-frame').src             = src;
  document.getElementById('pdf-dl').href               = src;
  document.getElementById('pdf-dl').download           = (titulo || 'apostila') + '.pdf';
  /* Esconde botão "Concluí" se já concluiu */
  const btnConcluir = document.getElementById('btn-pdf-concluir');
  if (btnConcluir) {
    const ja = _currentApostila && _progressoApostMap[_currentApostila.id]?.concluida;
    btnConcluir.style.display = (_currentApostila && !ja) ? '' : 'none';
    btnConcluir.textContent   = '✓ Concluí a leitura';
    btnConcluir.disabled = false;
  }
  /* Atualiza botão verde "Avaliar" no header */
  _atualizarBotaoAvaliarPDF();
  document.getElementById('pdf-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  /* Inicia timer de leitura — salva tempo a cada 30s */
  if (_apostilaTimer) clearInterval(_apostilaTimer);
  if (_currentApostila) {
    _apostilaTimer = setInterval(() => {
      _apostilaTickAccum += 30;
      _salvarProgressoApostila();
    }, 30000);
  }
}

async function _salvarProgressoApostila() {
  if (!_currentApostila) return;
  const id = _currentApostila.id;
  const prev = _progressoApostMap[id] || { segundos: 0, concluida: false };
  const novosSegundos = (prev.segundos || 0) + _apostilaTickAccum;
  _apostilaTickAccum = 0;
  const payload = {
    user_id:    _currentUserId,
    apostila_id: id,
    segundos:   novosSegundos,
    concluida:  !!prev.concluida,
    atualizado_em: new Date().toISOString(),
  };
  _progressoApostMap[id] = payload;
  await sb.from('progresso_apostilas').upsert(payload, { onConflict: 'user_id,apostila_id' });
}

async function concluirApostila() {
  if (!_currentApostila) return;
  const btn = document.getElementById('btn-pdf-concluir');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }

  const id = _currentApostila.id;
  const prev = _progressoApostMap[id] || { segundos: 0 };
  const payload = {
    user_id:    _currentUserId,
    apostila_id: id,
    segundos:   Math.max(prev.segundos || 0, _apostilaTickAccum, 30),
    concluida:  true,
    atualizado_em: new Date().toISOString(),
  };
  _progressoApostMap[id] = payload;
  const { error } = await sb.from('progresso_apostilas').upsert(payload, { onConflict: 'user_id,apostila_id' });
  if (btn) { btn.disabled = false; btn.textContent = '✓ Concluí a leitura'; btn.style.display = 'none'; }
  if (error) { alert('Erro: ' + error.message); return; }
  renderApostilas(_apostilasCache, !!window._isAdmin);

  /* Abre modal de feedback se ainda não avaliou */
  if (!jaAvaliou('apostila', id)) {
    setTimeout(() => abrirModalFeedback('apostila', id, _currentApostila.titulo, _currentApostila.num), 400);
  }
}

function fecharPDF() {
  /* Salva o tempo acumulado antes de fechar */
  if (_currentApostila && _apostilaTickAccum > 0) {
    _salvarProgressoApostila().catch(() => {});
  }
  if (_apostilaTimer) { clearInterval(_apostilaTimer); _apostilaTimer = null; }
  document.getElementById('pdf-overlay').classList.remove('open');
  document.getElementById('pdf-frame').src = '';
  document.body.style.overflow = '';
  _currentApostila = null;
  /* Atualiza grid pra refletir progresso */
  if (_apostilasCache.length) renderApostilas(_apostilasCache, !!window._isAdmin);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    fecharPDF(); fecharModalApostila?.(); fecharAula(); fecharModalAula?.();
    fecharTopico?.(); fecharNovoTopico?.();
  }
});

let _feedbacksAdminCache = [];
let _fbFilter            = 'todos';

async function carregarFeedbacksAdmin() {
  const tbody = document.getElementById('fb-tbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">Carregando…</td></tr>';

function renderFeedbackStats(listaFiltrada, labelMedia) {
  const wrap = document.getElementById('fb-stat-cards');
  if (!wrap) return;
  const total     = _feedbacksAdminCache.length;
  const aulas     = _feedbacksAdminCache.filter(f => f.tipo === 'aula').length;
  const apostilas = _feedbacksAdminCache.filter(f => f.tipo === 'apostila').length;
  const baixas    = _feedbacksAdminCache.filter(f => f.nota <= 2).length;
  /* A média responde ao filtro ativo (Aulas, Apostilas, ★≥4, ★≤2 ou Todos) */
  const lista = (listaFiltrada && listaFiltrada.length !== undefined) ? listaFiltrada : _feedbacksAdminCache;
  const media = lista.length ? (lista.reduce((a, f) => a + f.nota, 0) / lista.length) : 0;
  const lbl   = labelMedia || 'Nota média (todos)';
  wrap.innerHTML = `
    <div class="fb-stat-card"><div class="fb-stat-label">Total</div><div class="fb-stat-value">${total}</div></div>
    <div class="fb-stat-card"><div class="fb-stat-label">${escapeHtml(lbl)}</div><div class="fb-stat-value gold">${media ? media.toFixed(1) + ' ★' : '—'}</div></div>
    <div class="fb-stat-card"><div class="fb-stat-label">Aulas avaliadas</div><div class="fb-stat-value">${aulas}</div></div>
    <div class="fb-stat-card"><div class="fb-stat-label">Apostilas avaliadas</div><div class="fb-stat-value">${apostilas}</div></div>
    <div class="fb-stat-card"><div class="fb-stat-label">Baixas (≤ 2 ★)</div><div class="fb-stat-value" style="color:#dc2626">${baixas}</div></div>
  `;
}

function filterFeedbacks(filter, btn) {
  _fbFilter = filter;
  document.querySelectorAll('.fb-filter').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderFeedbacksTable();
}

function _fbFmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderFeedbacksTable() {
  const tbody = document.getElementById('fb-tbody');
  if (!tbody) return;

  let list = _feedbacksAdminCache;
  let labelMedia = 'Nota média (todos)';
  if (_fbFilter === 'aula') {
    list = list.filter(f => f.tipo === 'aula');
    labelMedia = 'Nota média (aulas)';
  } else if (_fbFilter === 'apostila') {
    list = list.filter(f => f.tipo === 'apostila');
    labelMedia = 'Nota média (apostilas)';
  } else if (_fbFilter === 'altas') {
    list = list.filter(f => f.nota >= 4);
    labelMedia = 'Nota média (★ ≥ 4)';
  } else if (_fbFilter === 'baixas') {
    list = list.filter(f => f.nota <= 2);
    labelMedia = 'Nota média (★ ≤ 2)';
  }
  /* Atualiza os cards de stats com a média ajustada ao filtro */
  renderFeedbackStats(list, labelMedia);

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">Nenhum feedback nesta categoria.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(f => {
    const nome = formatNome(f.autor_nome || '');
    const av   = initials(nome || f.autor_email || '?');
    const avHtml = f.autor_avatar
      ? `<img src="${escapeHtml(f.autor_avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : av;
    const stars = '★'.repeat(f.nota) + '☆'.repeat(5 - f.nota);
    const tipoIco = f.tipo === 'aula' ? '🎬' : '📘';
    return `
    <tr>
      <td>
        <div class="user-cell">
          <div class="av-sm" style="overflow:hidden">${avHtml}</div>
          <div>
            <div style="font-weight:600">${nome || '—'}</div>
            <div style="font-size:11px;color:var(--muted)">${escapeHtml(f.autor_email || '')}</div>
          </div>
        </div>
      </td>
      <td>
        <div style="font-weight:600">${tipoIco} ${escapeHtml(f.conteudo_num || '')}</div>
        <div style="font-size:12px;color:var(--muted)">${escapeHtml(f.conteudo_titulo || '(removido)')}</div>
      </td>
      <td><span class="fb-table-stars">${stars}</span></td>
      <td><div class="fb-coment-cell">${f.comentario ? escapeHtml(f.comentario) : '<em style="color:var(--muted)">— sem comentário —</em>'}</div></td>
      <td style="font-size:12px;color:var(--muted);white-space:nowrap">${_fbFmtDate(f.criado_em)}</td>
    </tr>`;
  }).join('');
}

async function updateUserField(userId, field, value) {
  const { error } = await sb.from('perfis').update({ [field]: value }).eq('id', userId);

async function toggleAtivoUser(userId, novoAtivo, nome) {
  const acao = novoAtivo ? 'ativar' : 'desativar';

function abrirModalCadUser() {
  document.getElementById('cu-nome').value  = '';
  document.getElementById('cu-email').value = '';
  document.getElementById('cu-senha').value = '';
  document.getElementById('cu-role').value  = 'user';
  document.getElementById('cu-plano').value = 'basico';
  document.getElementById('cu-erro').textContent = '';
  document.getElementById('modal-cad-user').classList.add('open');
}
function fecharModalCadUser() {
  document.getElementById('modal-cad-user').classList.remove('open');
}

async function cadastrarUsuario() {
  const nome  = document.getElementById('cu-nome').value.trim();
  const email = document.getElementById('cu-email').value.trim();
  const senha = document.getElementById('cu-senha').value;
  const role  = document.getElementById('cu-role').value;
  const plano = document.getElementById('cu-plano').value;
  const erro  = document.getElementById('cu-erro');
  const btn   = document.getElementById('btn-cu-save');

  erro.textContent = '';
  if (!nome || nome.split(/\s+/).length < 2)            { erro.textContent = 'Informe nome e sobrenome.'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))        { erro.textContent = 'E-mail inválido.'; return; }
  if (senha.length < 8)                                  { erro.textContent = 'Senha deve ter pelo menos 8 caracteres.'; return; }
  if (!/[a-zA-Z]/.test(senha) || !/\d/.test(senha))     { erro.textContent = 'Senha deve ter letras e números.'; return; }

  btn.disabled = true; btn.textContent = 'Cadastrando…';

  const { data, error } = await sb.rpc('admin_create_user', {
    p_email: email, p_password: senha, p_nome: nome,
    p_role: role, p_plano: plano
  });

  btn.disabled = false; btn.textContent = 'Cadastrar';

  if (error) {
    const msg = error.message.includes('já cadastrado') ? 'E-mail já cadastrado no sistema.' : 'Erro: ' + error.message;
    erro.textContent = msg; return;
  }

  fecharModalCadUser();
  await carregarUsuarios();
}

let _aulasCache       = [];
let _progressoMap     = {};  // aula_id → { segundos, duracao, concluida }
let _progressoApostMap = {}; // apostila_id → { segundos, concluida }
let _ytApiPromise     = null;

function escapeHtml(s='') {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Extrai o videoId de uma URL do YouTube (watch?v=, youtu.be, embed, shorts). */
function youtubeId(url) {
  if (!url || typeof url !== 'string') return null;
  const re = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;
  const m = url.match(re);
  return m ? m[1] : null;
}

function isYouTube(url) { return !!youtubeId(url); }

function parseQualidades(raw) {
  // Aceita: array JSON [{label,url}] OU string "label|url" por linha
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(q => q && q.url);
  if (typeof raw === 'string') {
    return raw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const [label, ...rest] = line.split('|');
      const url = rest.join('|').trim();
      return url ? { label: (label||'').trim() || 'auto', url } : null;
    }).filter(Boolean);
  }
  return [];
}

function qualidadesToText(arr) {
  if (!Array.isArray(arr)) return '';
  return arr.map(q => `${q.label||'auto'}|${q.url}`).join('\n');
}

function renderAulas(data, isAdmin) {
  _aulasCache = data;
  const grid = document.getElementById('aulas-grid');
  if (!grid) return;
  if (!data.length) {
    grid.innerHTML = '<p style="color:var(--muted)">Nenhuma aula cadastrada.</p>';
    return;
  }
  grid.innerHTML = data.map(a => {
    const disp = !!a.disponivel;
    const hasVideo = !!(a.video_url || (Array.isArray(a.qualidades) && a.qualidades.length));
    const clickable = disp && hasVideo;
    const thumbHtml = a.thumb_url
      ? `<img src="${escapeHtml(a.thumb_url)}" alt="">`
      : `<span style="font-size:42px">🎬</span>`;
    const prog = _progressoMap[a.id];
    const pct  = prog ? Math.min(100, Math.round((prog.segundos / Math.max(1, prog.duracao)) * 100)) : 0;
    const concluida = prog && prog.concluida;
    const fb = _meusFeedbacks['aula:' + a.id];
    return `
      <div class="aula-card" id="aulacard-${a.id}">
        <div class="aula-thumb ${clickable?'':'locked'}" ${clickable?`onclick="abrirAula(${a.id})"`:''}>
          ${thumbHtml}
          <div class="play-icon">${disp?'▶':'🔒'}</div>
        </div>
        <div>
          <div class="aula-title">${escapeHtml(a.titulo||'')}</div>
          ${pct > 0 ? `
            <div class="aula-progress"><div class="aula-progress-fill" style="width:${pct}%"></div></div>
            <div class="aula-pct">${concluida ? '<span class="aula-concluida-tag">✓ Concluída</span>' : pct + '% assistido'}</div>
          ` : ''}
        </div>
        ${a.descricao ? `<div class="aula-desc">${escapeHtml(a.descricao)}</div>` : ''}
        <span class="apostila-badge ${disp?'badge-open':'badge-locked'}">
          ${disp?'🔓 Disponível':'🔒 Em breve'}
        </span>
        ${disp ? `
          <button class="btn-avaliar ${fb?'avaliado':''}" onclick="abrirModalFeedback('aula',${a.id},'${escapeHtml(a.titulo||'').replace(/'/g,"\\'")}','${escapeHtml(a.num||'').replace(/'/g,"\\'")}')" title="${fb?'Sua nota: '+fb.nota+' / 5 — clique para ver/editar':'Avaliar esta aula'}" style="margin-top:auto">
            ${fb ? `<span class="mini-stars">${'★'.repeat(fb.nota)}${'☆'.repeat(5-fb.nota)}</span>` : '⭐ Avaliar agora'}
          </button>
        ` : ''}
        ${isAdmin ? `
        <div class="admin-actions">
          <button class="btn-ap-adm" onclick="toggleDisponivelAula(${a.id},${disp})" title="${disp?'Desativar':'Ativar'}">
            ${disp?'🔒':'🔓'} ${disp?'Desativar':'Ativar'}
          </button>
          <button class="btn-ap-adm" onclick="abrirModalAula(${a.id})" title="Editar">✏️ Editar</button>
          <button class="btn-ap-adm danger" onclick="deletarAula(${a.id})" title="Excluir">🗑️</button>
        </div>` : ''}
      </div>`;
  }).join('');
}

async function recarregarAulas() {
  const { data } = await sb.from('aulas').select('*').order('ordem');
  renderAulas(data || [], !!window._isAdmin);
}
